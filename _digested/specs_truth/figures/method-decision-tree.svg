<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#555"/></marker>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="badGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="neutralGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f3f4f6"/><stop offset="100%" stop-color="#e5e7eb"/></linearGradient>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#fafafa" rx="4"/>
  <text x="500" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">图3 · 修法选型（症状 → 原语）</text>

  <!-- root -->
  <rect x="350" y="44" width="300" height="40" rx="6" fill="url(#rootGrad)" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="500" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">specs 和现实对不上？→ 选原语</text>
  <line x1="500" y1="84" x2="500" y2="100" stroke="#a5b4fc" stroke-width="1.3"/>

  <!-- Lane 1: 内容要变 -->
  <rect x="40" y="104" width="240" height="64" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="160" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">内容要变</text>
  <text x="160" y="140" text-anchor="middle" font-size="8" fill="#b91c1c">③冻结 ⑤conventions过时</text>
  <text x="160" y="154" text-anchor="middle" font-size="8" fill="#b91c1c">⑥内容失准</text>
  <line x1="280" y1="136" x2="316" y2="136" stroke="#555" marker-end="url(#arrow)"/>
  <rect x="320" y="104" width="640" height="64" rx="5" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="640" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">修复原语 · delta + archive</text>
  <text x="640" y="140" text-anchor="middle" font-size="9" fill="#1d4ed8">RENAMED 改名 / REMOVED 删 / MODIFIED 换 / ADDED 补</text>
  <text x="640" y="156" text-anchor="middle" font-size="9" fill="#1d4ed8">大量混乱、整段重写 → /opsx:sync（LLM 变体）或 核选项（再基线）</text>

  <!-- Lane 2: 漏能力 -->
  <rect x="40" y="178" width="240" height="50" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="160" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">漏了能力（②）</text>
  <text x="160" y="216" text-anchor="middle" font-size="8" fill="#b91c1c">有代码无 spec</text>
  <line x1="280" y1="203" x2="316" y2="203" stroke="#555" marker-end="url(#arrow)"/>
  <rect x="320" y="178" width="640" height="50" rx="5" fill="url(#engineGrad)" stroke="#86efac"/>
  <text x="640" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">修复原语 · AUTHOR-NEW 能力 spec</text>
  <text x="640" y="216" text-anchor="middle" font-size="9" fill="#15803d">new change → specs/&lt;cap&gt;/spec.md（ADDED）→ archive（自校验）；如实描述已发运行为</text>

  <!-- Lane 3: 噪声 change -->
  <rect x="40" y="238" width="240" height="56" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">噪声 change（①④）</text>
  <text x="160" y="274" text-anchor="middle" font-size="8" fill="#b91c1c">①悬空不建 ④废弃僵尸</text>
  <text x="160" y="286" text-anchor="middle" font-size="8" fill="#b91c1c">无 CLI 删除命令 → 文件操作</text>
  <line x1="280" y1="266" x2="316" y2="266" stroke="#555" marker-end="url(#arrow)"/>
  <rect x="320" y="238" width="640" height="56" rx="5" fill="url(#warnGrad)" stroke="#fcd34d"/>
  <text x="640" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">清除原语 · DELETE / SHELVE</text>
  <text x="640" y="274" text-anchor="middle" font-size="9" fill="#b45309">设计有价值 → SHELVE 到 openspec/explorations/（可逆，优先）</text>
  <text x="640" y="288" text-anchor="middle" font-size="9" fill="#b45309">死透 / 重复 / 错方向 → DELETE（不可逆，慎用）</text>

  <!-- Lane 4: not found -->
  <rect x="40" y="304" width="240" height="116" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="160" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">archive 报</text>
  <text x="160" y="342" text-anchor="middle" font-size="9" fill="#b91c1c">"... not found"</text>
  <text x="160" y="362" text-anchor="middle" font-size="8" fill="#b91c1c">delta 与 spec 漂移</text>
  <text x="160" y="378" text-anchor="middle" font-size="8" fill="#b91c1c">（原子回滚，整批不落地）</text>
  <text x="160" y="400" text-anchor="middle" font-size="8" fill="#b91c1c">详见 04 诊断树</text>
  <line x1="280" y1="362" x2="316" y2="362" stroke="#555" marker-end="url(#arrow)"/>
  <rect x="320" y="304" width="640" height="116" rx="5" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="640" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#4b5563">先 grep 当前 spec 标题，再判断属于哪种：</text>
  <text x="340" y="346" font-size="9" fill="#4b5563">(a) 仅大小写/标点差</text>
  <text x="640" y="346" font-size="9" fill="#1d4ed8">→ 修复原语：RENAMED 扳正 / 改 delta 名字</text>
  <text x="340" y="364" font-size="9" fill="#4b5563">(b) 整段已被重写</text>
  <text x="640" y="364" font-size="9" fill="#1d4ed8">→ 修复原语：逐条对齐  /  核选项：再基线</text>
  <text x="340" y="382" font-size="9" fill="#4b5563">(c) 早该不存在了</text>
  <text x="640" y="382" font-size="9" fill="#1d4ed8">→ 从 delta 删掉这条</text>
  <text x="340" y="400" font-size="9" fill="#4b5563">(d) 笔误 / 臆造</text>
  <text x="640" y="400" font-size="9" fill="#1d4ed8">→ 改正 delta 名字</text>
  <text x="640" y="414" text-anchor="middle" font-size="8" fill="#9ca3af">★ 别用 --no-validate 强行 archive —— 那会把漂移焊死进真相</text>

  <!-- Lane 5: 预防/发现 -->
  <rect x="40" y="432" width="240" height="56" rx="5" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="160" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#4b5563">想预防 / 想发现</text>
  <text x="160" y="472" text-anchor="middle" font-size="8" fill="#4b5563">（不是救火，是日常）</text>
  <line x1="280" y1="460" x2="316" y2="460" stroke="#555" marker-end="url(#arrow)"/>
  <rect x="320" y="432" width="640" height="56" rx="5" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="640" y="454" text-anchor="middle" font-size="10" font-weight="bold" fill="#4b5563">前置纪律（防积累）   |   巡检（发现漂移）</text>
  <text x="640" y="472" text-anchor="middle" font-size="9" fill="#4b5563">做完即 archive · 改名走 RENAMED · validate --all 偶尔体检  ｜  list/view · grep 悬空 · src↔specs 对照</text>

  <rect x="40" y="502" width="920" height="40" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="500" y="520" text-anchor="middle" font-size="9" font-weight="bold" fill="#222">原则：not found 不是 bug，是身份模型在喊"漂移了"。</text>
  <text x="500" y="535" text-anchor="middle" font-size="9" fill="#4b5563">正确反应 = 先查当前 spec 实际标题 → 用修复原语（delta）或核选项（再基线）；把对账当回事，specs 才配叫 source of truth。</text>
</svg>
