<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#555"/>
    </marker>
    <marker id="arrowDown" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowFix" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#15803d"/>
    </marker>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="badGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="neutralGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f3f4f6"/><stop offset="100%" stop-color="#e5e7eb"/></linearGradient>
    <linearGradient id="truthGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bbf7d0"/><stop offset="100%" stop-color="#86efac"/></linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#fafafa" rx="4"/>
  <text x="500" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">主 specs 的造 · 漏 · 修（全局一图）</text>

  <!-- ===== BAND 1: 造 ===== -->
  <rect x="15" y="46" width="970" height="170" rx="6" fill="none" stroke="#86efac" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="28" y="62" font-size="10" font-weight="bold" fill="#15803d">① 造 · 机理（01）</text>

  <!-- delta -->
  <rect x="40" y="78" width="200" height="80" rx="5" fill="url(#dataGrad)" stroke="#fdba74"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">delta spec</text>
  <text x="140" y="116" text-anchor="middle" font-size="9" fill="#c2410c">changes/&lt;id&gt;/specs/</text>
  <text x="140" y="132" text-anchor="middle" font-size="9" fill="#c2410c">## ADDED / MODIFIED</text>
  <text x="140" y="146" text-anchor="middle" font-size="9" fill="#c2410c">## REMOVED / RENAMED</text>
  <line x1="240" y1="118" x2="278" y2="118" stroke="#555" marker-end="url(#arrow)"/>

  <!-- archive -->
  <rect x="280" y="78" width="200" height="80" rx="5" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="380" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">openspec archive</text>
  <text x="380" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8">唯一确定写入动词</text>
  <text x="380" y="132" text-anchor="middle" font-size="9" fill="#1d4ed8">原子 fail-fast</text>
  <text x="380" y="148" text-anchor="middle" font-size="9" fill="#b91c1c">（没有 apply 命令）</text>
  <line x1="480" y1="118" x2="518" y2="118" stroke="#555" marker-end="url(#arrow)"/>

  <!-- buildUpdatedSpec -->
  <rect x="520" y="78" width="210" height="80" rx="5" fill="url(#engineGrad)" stroke="#86efac"/>
  <text x="625" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">buildUpdatedSpec()</text>
  <text x="625" y="116" text-anchor="middle" font-size="9" fill="#15803d">RENAMED→REMOVED</text>
  <text x="625" y="130" text-anchor="middle" font-size="9" fill="#15803d">→MODIFIED→ADDED</text>
  <text x="625" y="146" text-anchor="middle" font-size="9" fill="#15803d">整块替换 · 按标题匹配</text>
  <line x1="730" y1="118" x2="768" y2="118" stroke="#555" marker-end="url(#arrow)"/>

  <!-- specs (source of truth) -->
  <rect x="770" y="74" width="200" height="88" rx="6" fill="url(#truthGrad)" stroke="#22c55e" stroke-width="1.6"/>
  <text x="870" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">openspec/specs/</text>
  <text x="870" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">source of truth</text>
  <text x="870" y="134" text-anchor="middle" font-size="9" fill="#14532d">主 specs / 现状事实层</text>
  <text x="870" y="150" text-anchor="middle" font-size="9" fill="#14532d">（不是愿望层）</text>

  <!-- identity note -->
  <rect x="520" y="168" width="450" height="34" rx="4" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="745" y="183" text-anchor="middle" font-size="9" fill="#4b5563">身份枢纽：requirement 无 ID = "### Requirement: &lt;Name&gt;" 原文</text>
  <text x="745" y="196" text-anchor="middle" font-size="9" fill="#b91c1c">normalizeRequirementName 仅 trim · 大小写敏感（段头却大小写不敏感）</text>

  <!-- alt path note -->
  <rect x="40" y="168" width="250" height="34" rx="4" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="165" y="183" text-anchor="middle" font-size="9" fill="#4b5563">另一路：/opsx:sync</text>
  <text x="165" y="196" text-anchor="middle" font-size="9" fill="#4b5563">LLM 非确定再对齐 · 幂等</text>

  <!-- ===== BAND 2: 漏 ===== -->
  <rect x="15" y="232" width="970" height="200" rx="6" fill="none" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="28" y="248" font-size="10" font-weight="bold" fill="#b91c1c">② 漏 · 漂移（02）—— 长期默认会失真</text>

  <!-- three gaps -->
  <rect x="40" y="262" width="290" height="74" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="185" y="281" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">缺口① validate 逐文件</text>
  <text x="185" y="299" text-anchor="middle" font-size="9" fill="#b91c1c">从不打开主 spec</text>
  <text x="185" y="313" text-anchor="middle" font-size="9" fill="#b91c1c">⇒ delta↔spec 失配</text>
  <text x="185" y="327" text-anchor="middle" font-size="9" fill="#b91c1c">静默通过 validate</text>

  <rect x="355" y="262" width="290" height="74" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="500" y="281" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">缺口② 匹配只在 archive</text>
  <text x="500" y="299" text-anchor="middle" font-size="9" fill="#b91c1c">且只看这一次</text>
  <text x="500" y="313" text-anchor="middle" font-size="9" fill="#b91c1c">一次成功就写入真相</text>
  <text x="500" y="327" text-anchor="middle" font-size="9" fill="#b91c1c">从此被盲信，不再回看</text>

  <rect x="670" y="262" width="290" height="74" rx="5" fill="url(#badGrad)" stroke="#fca5a5"/>
  <text x="815" y="281" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">缺口③ 无审计/修复命令</text>
  <text x="815" y="299" text-anchor="middle" font-size="9" fill="#b91c1c">无 log / repair / prune</text>
  <text x="815" y="313" text-anchor="middle" font-size="9" fill="#b91c1c">无 audit / 无 apply</text>
  <text x="815" y="327" text-anchor="middle" font-size="9" fill="#b91c1c">全靠人</text>

  <line x1="500" y1="340" x2="500" y2="358" stroke="#b91c1c" marker-end="url(#arrowDown)"/>
  <text x="513" y="354" font-size="9" fill="#b91c1c">钻成六类噪声</text>

  <!-- six seams -->
  <text x="500" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">六条噪声缝（02 实证）</text>
  <rect x="40"  y="380" width="305" height="24" rx="4" fill="url(#warnGrad)" stroke="#fcd34d"/><text x="192" y="396" text-anchor="middle" font-size="9" fill="#b45309">① 悬空 delta 目标</text>
  <rect x="355" y="380" width="290" height="24" rx="4" fill="url(#warnGrad)" stroke="#fcd34d"/><text x="500" y="396" text-anchor="middle" font-size="9" fill="#b45309">② 有代码无 spec</text>
  <rect x="655" y="380" width="305" height="24" rx="4" fill="url(#warnGrad)" stroke="#fcd34d"/><text x="807" y="396" text-anchor="middle" font-size="9" fill="#b45309">③ 冻结 spec</text>
  <rect x="40"  y="408" width="305" height="24" rx="4" fill="url(#warnGrad)" stroke="#fcd34d"/><text x="192" y="424" text-anchor="middle" font-size="9" fill="#b45309">④ 废弃仍 active change</text>
  <rect x="355" y="408" width="290" height="24" rx="4" fill="url(#warnGrad)" stroke="#fcd34d"/><text x="500" y="424" text-anchor="middle" font-size="9" fill="#b45309">⑤ 平行权威层未对齐</text>
  <rect x="655" y="408" width="305" height="24" rx="4" fill="url(#warnGrad)" stroke="#fcd34d"/><text x="807" y="424" text-anchor="middle" font-size="9" fill="#b45309">⑥ 身份脆弱性</text>

  <!-- arrow to fix -->
  <line x1="500" y1="438" x2="500" y2="462" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowFix)"/>
  <text x="513" y="456" font-size="9" font-weight="bold" fill="#15803d">靠手段修</text>

  <!-- ===== BAND 3: 修 ===== -->
  <rect x="15" y="466" width="970" height="200" rx="6" fill="none" stroke="#86efac" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="28" y="482" font-size="10" font-weight="bold" fill="#15803d">③ 修 · 原语（03 / 04）</text>

  <rect x="40"  y="496" width="305" height="66" rx="5" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="192" y="514" text-anchor="middle" font-size="9" fill="#1d4ed8">内容失准（③⑤⑥）</text>
  <text x="192" y="532" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">修复原语 · delta + archive</text>
  <text x="192" y="548" text-anchor="middle" font-size="9" fill="#1d4ed8">大量混乱 → ②/opsx:sync 或 ⑤再基线</text>

  <rect x="355" y="496" width="290" height="66" rx="5" fill="url(#engineGrad)" stroke="#86efac"/>
  <text x="500" y="514" text-anchor="middle" font-size="9" fill="#15803d">漏了能力（②）</text>
  <text x="500" y="532" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">修复原语 · AUTHOR-NEW 补 spec</text>
  <text x="500" y="548" text-anchor="middle" font-size="9" fill="#15803d">如实描述已发运行为</text>

  <rect x="655" y="496" width="305" height="66" rx="5" fill="url(#warnGrad)" stroke="#fcd34d"/>
  <text x="807" y="514" text-anchor="middle" font-size="9" fill="#b45309">噪声 change（①④）</text>
  <text x="807" y="532" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">清除原语 · DELETE / SHELVE</text>
  <text x="807" y="548" text-anchor="middle" font-size="9" fill="#b45309">优先 SHELVE（可逆）</text>

  <rect x="40"  y="572" width="470" height="40" rx="5" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="275" y="590" text-anchor="middle" font-size="9" fill="#4b5563">想预防积累 → 前置纪律</text>
  <text x="275" y="605" text-anchor="middle" font-size="9" fill="#4b5563">做完即 archive · 改名走 RENAMED · 能力名稳定 · validate --all 偶尔体检</text>

  <rect x="520" y="572" width="440" height="40" rx="5" fill="url(#neutralGrad)" stroke="#d1d5db"/>
  <text x="740" y="590" text-anchor="middle" font-size="9" fill="#4b5563">想主动发现 → 巡检</text>
  <text x="740" y="605" text-anchor="middle" font-size="9" fill="#4b5563">list/view/validate --all · grep 悬空 · src↔specs 对照</text>

  <rect x="40" y="624" width="920" height="32" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="500" y="644" text-anchor="middle" font-size="10" font-weight="bold" fill="#222">一句话：主 specs 靠 delta + archive 这条受控流水线造，也靠同一条流水线修 —— 别手搓 spec。</text>
</svg>
