<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Capability taxonomy：系统、domain 与独立行为合同</title>
  <desc id="desc">系统行为被组织到 identity 和 billing 命名空间；每张 capability 卡片都是独立合同，目录层次不是继承关系。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .system { fill: #172554; }
    .domain { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
    .card { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .label { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .small { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    .white { font: 600 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
    .path { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0369a1; }
    .link { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .note { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
  </style>
  <rect class="bg" width="1200" height="720" rx="24"/>
  <rect class="system" x="400" y="34" width="400" height="88" rx="18"/>
  <text class="white" x="600" y="88" text-anchor="middle">整个系统的可观察行为</text>
  <path class="link" d="M500 122 L310 190 M700 122 L890 190"/>
  <rect class="domain" x="70" y="190" width="480" height="375" rx="20"/>
  <text class="label" x="105" y="235">identity domain</text>
  <text class="small" x="105" y="263">组织与发现的命名空间</text>
  <rect class="domain" x="650" y="190" width="480" height="375" rx="20"/>
  <text class="label" x="685" y="235">billing domain</text>
  <text class="small" x="685" y="263">组织与发现的命名空间</text>
  <rect class="card" x="105" y="300" width="185" height="168" rx="14"/>
  <text class="label" x="125" y="340">登录</text>
  <text class="path" x="125" y="372">identity/login</text>
  <text class="small" x="125" y="407">独立行为合同</text>
  <text class="small" x="125" y="433">独立 scenarios</text>
  <rect class="card" x="325" y="300" width="185" height="168" rx="14"/>
  <text class="label" x="345" y="340">会话</text>
  <text class="path" x="345" y="372">identity/session</text>
  <text class="small" x="345" y="407">独立行为合同</text>
  <text class="small" x="345" y="433">独立 scenarios</text>
  <rect class="card" x="685" y="300" width="185" height="168" rx="14"/>
  <text class="label" x="705" y="340">发票</text>
  <text class="path" x="705" y="372">billing/invoices</text>
  <text class="small" x="705" y="407">独立行为合同</text>
  <text class="small" x="705" y="433">独立 scenarios</text>
  <rect class="card" x="905" y="300" width="185" height="168" rx="14"/>
  <text class="label" x="925" y="340">订阅</text>
  <text class="path" x="925" y="372">billing/subscriptions</text>
  <text class="small" x="925" y="407">独立行为合同</text>
  <text class="small" x="925" y="433">独立 scenarios</text>
  <rect class="note" x="190" y="610" width="820" height="65" rx="14"/>
  <text class="label" x="600" y="650" text-anchor="middle">目录层次 = 命名空间；不是父子继承、自动聚合或自动读取。</text>
</svg>
