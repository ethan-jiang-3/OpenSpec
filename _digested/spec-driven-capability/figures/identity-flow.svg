<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Capability path 的 schema 与 CLI 生命周期</title>
  <desc id="desc">proposal 声明 capability path，change delta 和 main spec 使用相同相对路径，CLI discovery 和 archive/apply 用此 ID 读取和映射文件。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.7; }
    .proposal { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.8; }
    .delta { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
    .main { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
    .engine { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
    .label { font: 600 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    .mono { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e3a8a; }
    .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text class="label" x="65" y="55">同一个 capability path 是 schema 契约，也是 CLI 的文件地址</text>
  <rect class="proposal" x="60" y="110" width="245" height="165" rx="18"/>
  <text class="label" x="85" y="150">proposal</text>
  <text class="small" x="85" y="185">Capabilities 声明：</text>
  <text class="mono" x="85" y="218">identity/session</text>
  <text class="small" x="85" y="248">New 或 Modified</text>
  <path class="arrow" d="M305 193 L390 193"/>
  <rect class="delta" x="400" y="110" width="340" height="165" rx="18"/>
  <text class="label" x="425" y="150">change delta</text>
  <text class="mono" x="425" y="188">changes/&lt;change&gt;/specs/</text>
  <text class="mono" x="425" y="212">identity/session/spec.md</text>
  <text class="small" x="425" y="248">相对 path 产生 ID</text>
  <path class="arrow" d="M740 193 L825 193"/>
  <rect class="main" x="835" y="110" width="305" height="165" rx="18"/>
  <text class="label" x="860" y="150">main spec</text>
  <text class="mono" x="860" y="188">specs/identity/</text>
  <text class="mono" x="860" y="212">session/spec.md</text>
  <text class="small" x="860" y="248">同 path 的事实基线</text>
  <rect class="engine" x="355" y="370" width="490" height="120" rx="18"/>
  <text class="label" x="600" y="410" text-anchor="middle">discoverSpecFiles() → ID = identity/session</text>
  <text class="small" x="600" y="446" text-anchor="middle">list / validate / parser / apply / archive 共享这一发现与映射模型</text>
  <path class="dash" d="M570 275 L570 370"/>
  <path class="dash" d="M988 275 L785 370"/>
  <rect class="box" x="190" y="535" width="820" height="46" rx="13"/>
  <text class="small" x="600" y="565" text-anchor="middle">改变 path = 改 capability identity；目录层次不提供继承、聚合或自动 retrieval。</text>
</svg>
