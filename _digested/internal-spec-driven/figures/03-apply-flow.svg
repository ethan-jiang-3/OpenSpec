<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,3 Z" fill="#555"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,3 Z" fill="#999"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,3 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,3 Z" fill="#16a34a"/>
    </marker>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="fsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/><stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="500" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">apply 的三方架构实例化</text>

  <!-- Column headers -->
  <rect x="30" y="35" width="195" height="24" rx="4" fill="url(#userGrad)" stroke="#d1d5db"/>
  <text x="127" y="51" text-anchor="middle" font-size="10" fill="#666">User</text>

  <rect x="260" y="35" width="275" height="24" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="397" y="51" text-anchor="middle" font-size="10" fill="#2563eb">Host Agent</text>

  <rect x="570" y="35" width="185" height="24" rx="4" fill="url(#cliGrad)" stroke="#86efac"/>
  <text x="662" y="51" text-anchor="middle" font-size="10" fill="#16a34a">OpenSpec CLI</text>

  <rect x="790" y="35" width="180" height="24" rx="4" fill="url(#fsGrad)" stroke="#fdba74"/>
  <text x="880" y="51" text-anchor="middle" font-size="10" fill="#ea580c">文件系统</text>

  <!-- Step 1: Trigger apply -->
  <rect x="40" y="70" width="175" height="30" rx="4" fill="url(#userGrad)" stroke="#d1d5db"/>
  <text x="127" y="89" text-anchor="middle" font-size="9" fill="#666">/opsx:apply add-dark-mode</text>

  <line x1="215" y1="85" x2="260" y2="85" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Agent: resolve change -->
  <rect x="270" y="70" width="255" height="30" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="397" y="89" text-anchor="middle" font-size="9" fill="#2563eb">1. 解析 change name（validateChangeExists）</text>

  <!-- Agent: get status -->
  <rect x="270" y="110" width="255" height="30" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="397" y="129" text-anchor="middle" font-size="9" fill="#2563eb">2. openspec status --change "X" --json</text>
  <line x1="525" y1="125" x2="570" y2="125" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="580" y="110" width="165" height="30" rx="4" fill="url(#cliGrad)" stroke="#86efac"/>
  <text x="662" y="129" text-anchor="middle" font-size="9" fill="#16a34a">loadChangeContext()</text>

  <!-- Agent: get apply instructions = GATE -->
  <rect x="270" y="155" width="255" height="36" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="397" y="170" text-anchor="middle" font-size="9" fill="#2563eb">3. openspec instructions apply</text>
  <text x="397" y="184" text-anchor="middle" font-size="9" fill="#2563eb">   --change "X" --json</text>
  <line x1="525" y1="173" x2="570" y2="173" stroke="#555" marker-end="url(#arrow)"/>

  <!-- CLI: gate logic -->
  <rect x="580" y="148" width="165" height="76" rx="4" fill="url(#cliGrad)" stroke="#86efac"/>
  <text x="662" y="163" text-anchor="middle" font-size="8" fill="#16a34a">generateApplyInstructions:</text>
  <text x="662" y="176" text-anchor="middle" font-size="8" fill="#16a34a">① 检查 apply.requires</text>
  <text x="662" y="189" text-anchor="middle" font-size="8" fill="#16a34a">   缺失→blocked</text>
  <text x="662" y="202" text-anchor="middle" font-size="8" fill="#16a34a">② 读 tasks.md</text>
  <text x="662" y="215" text-anchor="middle" font-size="8" fill="#16a34a">③ 解析 checkbox（regex）</text>

  <!-- FS read: tasks.md -->
  <rect x="790" y="155" width="180" height="30" rx="4" fill="url(#fsGrad)" stroke="#fdba74"/>
  <text x="880" y="174" text-anchor="middle" font-size="9" fill="#ea580c">tasks.md checkbox 扫描</text>

  <!-- Return gate state -->
  <path d="M580,230 Q560,230 550,248 Q540,266 525,255 L525,200" stroke="#999" fill="none" stroke-dasharray="3,2" marker-end="url(#arrowGray)"/>
  <text x="503" y="245" text-anchor="middle" font-size="8" fill="#999">返回 state</text>

  <!-- ===== THREE-WAY GATE ===== -->
  <rect x="260" y="250" width="710" height="140" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-dasharray="6,3"/>
  <text x="272" y="266" font-size="9" font-weight="bold" fill="#dc2626">Gate：state 三分支</text>

  <!-- Branch 1: blocked -->
  <rect x="275" y="278" width="220" height="48" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="385" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">state: "blocked"</text>
  <text x="385" y="308" text-anchor="middle" font-size="8" fill="#991b1b">展示 missingArtifacts</text>
  <text x="385" y="320" text-anchor="middle" font-size="8" fill="#991b1b">→ 建议 /opsx:propose 回去补全</text>

  <!-- Branch 2: all_done -->
  <rect x="505" y="278" width="220" height="48" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="615" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">state: "all_done"</text>
  <text x="615" y="308" text-anchor="middle" font-size="8" fill="#14532d">所有 checkbox 已打勾</text>
  <text x="615" y="320" text-anchor="middle" font-size="8" fill="#14532d">→ 建议 /opsx:archive</text>

  <!-- Branch 3: ready -->
  <rect x="735" y="278" width="225" height="48" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="847" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">state: "ready"</text>
  <text x="847" y="308" text-anchor="middle" font-size="8" fill="#1e3a5f">tasks.md 存在，有未完成 checkbox</text>
  <text x="847" y="320" text-anchor="middle" font-size="8" fill="#1e3a5f">→ 进入实施循环 ▼</text>

  <!-- Down arrow from ready only -->
  <line x1="847" y1="326" x2="847" y2="400" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== IMPLEMENTATION LOOP ===== -->
  <rect x="260" y="400" width="710" height="200" rx="6" fill="none" stroke="#93c5fd" stroke-width="1.1" stroke-dasharray="6,3"/>
  <text x="272" y="416" font-size="9" font-weight="bold" fill="#2563eb">实施循环（fluid workflow）</text>

  <!-- Read context -->
  <rect x="275" y="428" width="225" height="36" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="387" y="444" text-anchor="middle" font-size="9" fill="#2563eb">Step 4: 读 contextFiles</text>
  <text x="387" y="457" text-anchor="middle" font-size="8" fill="#6b7280">proposal / specs / design / tasks</text>

  <rect x="790" y="428" width="180" height="36" rx="4" fill="url(#fsGrad)" stroke="#fdba74"/>
  <text x="880" y="444" text-anchor="middle" font-size="8" fill="#ea580c">openspec/changes/X/</text>
  <text x="880" y="457" text-anchor="middle" font-size="8" fill="#ea580c">*.md 全部 context 文件</text>

  <!-- Step 5: show progress -->
  <rect x="275" y="475" width="225" height="24" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="387" y="491" text-anchor="middle" font-size="9" fill="#2563eb">Step 5: 展示进度 (0/7 done)</text>

  <!-- Step 6: implement -->
  <rect x="275" y="510" width="225" height="40" rx="4" fill="url(#agentGrad)" stroke="#93c5fd"/>
  <text x="387" y="526" text-anchor="middle" font-size="9" fill="#2563eb">Step 6: 取 pending task，实施</text>
  <text x="387" y="540" text-anchor="middle" font-size="8" fill="#6b7280">写代码 → 标记 - [x]</text>

  <rect x="790" y="512" width="180" height="38" rx="4" fill="url(#fsGrad)" stroke="#fdba74"/>
  <text x="880" y="528" text-anchor="middle" font-size="8" fill="#ea580c">tasks.md 更新 checkbox</text>
  <text x="880" y="540" text-anchor="middle" font-size="8" fill="#ea580c">src/ 代码修改</text>

  <!-- Check: more tasks? -->
  <rect x="275" y="562" width="225" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="387" y="581" text-anchor="middle" font-size="9" fill="#92400e">还有未完成 task?</text>

  <!-- Loop back arrow -->
  <path d="M275,576 L235,576 L235,446 L275,446" stroke="#f59e0b" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowGray)"/>
  <text x="230" y="515" text-anchor="middle" font-size="8" fill="#f59e0b" transform="rotate(-90,230,515)">是</text>

  <!-- All done -->
  <text x="390" y="615" text-anchor="middle" font-size="9" fill="#16a34a">否 → 全部完成 ✓ → 建议 /opsx:archive</text>

  <!-- Legend -->
  <rect x="30" y="635" width="940" height="38" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="50" y="650" font-size="8" fill="#999">图例：</text>
  <rect x="90" y="642" width="40" height="12" rx="2" fill="url(#agentGrad)" stroke="#93c5fd"/><text x="135" y="652" font-size="8" fill="#666">Agent</text>
  <rect x="170" y="642" width="40" height="12" rx="2" fill="url(#cliGrad)" stroke="#86efac"/><text x="215" y="652" font-size="8" fill="#666">CLI</text>
  <rect x="250" y="642" width="40" height="12" rx="2" fill="url(#fsGrad)" stroke="#fdba74"/><text x="295" y="652" font-size="8" fill="#666">文件系统</text>
  <rect x="340" y="642" width="40" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/><text x="385" y="652" font-size="8" fill="#666">条件</text>
  <rect x="420" y="642" width="60" height="12" rx="2" fill="none" stroke="#93c5fd" stroke-dasharray="6,3"/><text x="453" y="652" text-anchor="middle" font-size="8" fill="#666">循环</text>
  <text x="530" y="652" font-size="8" fill="#999">CLI 只做 gate 判定 + checkbox 解析；文本生成（代码）是 agent 的事</text>
</svg>
