<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">openspec/config.yaml 八大字段在各阶段的精确消费路由图</title>
  <desc id="desc">完整映射 openspec/config.yaml（及 .yml）八大顶层字段（schema、context、rules、operations、references、store、skillsScope、githubCopilot.cloudAgent）在各命令阶段的精确消费者与隔离边界，并标注 validate 硬阻断与常规命令容错双轨策略。</desc>
  <style>
    .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .sec-h { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .th-h { font: 700 12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace; }
    .th-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .cell-h { font: 700 12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace; }
    .cell-t { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .flow-h { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace; }
    .flow-t { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .c-slate { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.3; }
    .c-muted { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    .c-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .c-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .c-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .c-purple { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .c-orange { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; }
    .c-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.8; }
    .c-soft { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrSlate); }
  </style>
  <defs>
    <marker id="arrSlate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1278" height="858" rx="16"/>

  <!-- Header -->
  <text class="title" x="640" y="38" text-anchor="middle">openspec/config.yaml 八大字段在各阶段的精确消费路由图</text>
  <text class="subtitle" x="640" y="64" text-anchor="middle">精确标注「哪个字段进哪个阶段、哪个字段严禁越界」—— 彻底厘清 rules 与 operations 的消费边界</text>

  <!-- ==================== SECTION A: MATRIX (FIELDS 1-5) ==================== -->
  <rect class="panel" x="24" y="84" width="1232" height="460" rx="14"/>
  <text class="sec-h" x="40" y="112">A · 工作流骨架与上下文提示注入路由矩阵（字段 1–5）</text>

  <!-- Column Headers (y=124..178, h=54) -->
  <rect class="c-slate" x="40" y="124" width="236" height="54" rx="8"/>
  <text class="th-h" x="158" y="146" text-anchor="middle" fill="#0f172a">config.yaml 顶层字段</text>
  <text class="th-sub" x="158" y="168" text-anchor="middle" fill="#475569">类型与大小约束</text>

  <rect class="c-slate" x="284" y="124" width="172" height="54" rx="8"/>
  <text class="th-h" x="370" y="146" text-anchor="middle" fill="#0f172a">new change / status</text>
  <text class="th-sub" x="370" y="168" text-anchor="middle" fill="#475569">工作流骨架解析</text>

  <rect class="c-blue" x="464" y="124" width="208" height="54" rx="8"/>
  <text class="th-h" x="568" y="146" text-anchor="middle" fill="#1e40af">instructions &lt;artifact&gt;</text>
  <text class="th-sub" x="568" y="168" text-anchor="middle" fill="#1e3a8a">proposal·specs·design·tasks</text>

  <rect class="c-green" x="680" y="124" width="184" height="54" rx="8"/>
  <text class="th-h" x="772" y="146" text-anchor="middle" fill="#14532d">instructions apply</text>
  <text class="th-sub" x="772" y="168" text-anchor="middle" fill="#166534">实施阶段指令面</text>

  <rect class="c-purple" x="872" y="124" width="184" height="54" rx="8"/>
  <text class="th-h" x="964" y="146" text-anchor="middle" fill="#4c1d95">instructions archive</text>
  <text class="th-sub" x="964" y="168" text-anchor="middle" fill="#5b21b6">归档前只读输入面</text>

  <rect class="c-amber" x="1064" y="124" width="176" height="54" rx="8"/>
  <text class="th-h" x="1152" y="146" text-anchor="middle" fill="#92400e">其他消费表面</text>
  <text class="th-sub" x="1152" y="168" text-anchor="middle" fill="#78350f">Explore·doctor·context</text>

  <!-- Row 1: schema (y=186..250, h=64) -->
  <rect class="c-slate" x="40" y="186" width="236" height="64" rx="8"/>
  <text class="cell-h" x="54" y="210" fill="#0f172a">1. schema</text>
  <text class="cell-t" x="54" y="232" fill="#334155">string · 默认工作流骨架名</text>

  <rect class="c-green" x="284" y="186" width="172" height="64" rx="8"/>
  <text class="cell-h" x="370" y="210" text-anchor="middle" fill="#14532d">✓ 默认工作流名</text>
  <text class="cell-t" x="370" y="232" text-anchor="middle" fill="#166534">次于 --schema 与元数据</text>

  <rect class="c-green" x="464" y="186" width="208" height="64" rx="8"/>
  <text class="cell-h" x="568" y="210" text-anchor="middle" fill="#14532d">✓ 回退解析 DAG</text>
  <text class="cell-t" x="568" y="232" text-anchor="middle" fill="#166534">加载对应模板与指令</text>

  <rect class="c-slate" x="680" y="186" width="184" height="64" rx="8"/>
  <text class="cell-h" x="772" y="210" text-anchor="middle" fill="#1e293b">✓ 解析 apply 块</text>
  <text class="cell-t" x="772" y="232" text-anchor="middle" fill="#475569">requires 与 tracks</text>

  <rect class="c-muted" x="872" y="186" width="184" height="64" rx="8"/>
  <text class="cell-h" x="964" y="210" text-anchor="middle" fill="#64748b">— 不直接消费</text>
  <text class="cell-t" x="964" y="232" text-anchor="middle" fill="#64748b">按 specs/ 目录结构归档</text>

  <rect class="c-slate" x="1064" y="186" width="176" height="64" rx="8"/>
  <text class="cell-h" x="1152" y="210" text-anchor="middle" fill="#1e293b">✓ Explore 查状态</text>
  <text class="cell-t" x="1152" y="232" text-anchor="middle" fill="#475569">经 status 间接解析</text>

  <!-- Row 2: context (y=256..320, h=64) -->
  <rect class="c-blue" x="40" y="256" width="236" height="64" rx="8"/>
  <text class="cell-h" x="54" y="280" fill="#1e40af">2. context</text>
  <text class="cell-t" x="54" y="302" fill="#1e3a8a">string · UTF-8 ≤ 50KB</text>

  <rect class="c-muted" x="284" y="256" width="172" height="64" rx="8"/>
  <text class="cell-h" x="370" y="280" text-anchor="middle" fill="#64748b">— 不进入</text>
  <text class="cell-t" x="370" y="302" text-anchor="middle" fill="#64748b">status 不含背景文本</text>

  <rect class="c-blue" x="464" y="256" width="208" height="64" rx="8"/>
  <text class="cell-h" x="568" y="280" text-anchor="middle" fill="#1e40af">✓ &lt;project_context&gt;</text>
  <text class="cell-t" x="568" y="302" text-anchor="middle" fill="#1e3a8a">注入全部 planning 制品</text>

  <rect class="c-blue" x="680" y="256" width="184" height="64" rx="8"/>
  <text class="cell-h" x="772" y="280" text-anchor="middle" fill="#1e40af">✓ JSON context</text>
  <text class="cell-t" x="772" y="302" text-anchor="middle" fill="#1e3a8a">实施阶段全局背景</text>

  <rect class="c-blue" x="872" y="256" width="184" height="64" rx="8"/>
  <text class="cell-h" x="964" y="280" text-anchor="middle" fill="#1e40af">✓ JSON context</text>
  <text class="cell-t" x="964" y="302" text-anchor="middle" fill="#1e3a8a">归档前全局背景输入</text>

  <rect class="c-blue" x="1064" y="256" width="176" height="64" rx="8"/>
  <text class="cell-h" x="1152" y="280" text-anchor="middle" fill="#1e40af">✓ Explore 直读</text>
  <text class="cell-t" x="1152" y="302" text-anchor="middle" fill="#1e3a8a">探索会话背景约束</text>

  <!-- Row 3: rules.<artifactId> (y=326..390, h=64) -->
  <rect class="c-amber" x="40" y="326" width="236" height="64" rx="8"/>
  <text class="cell-h" x="54" y="350" fill="#92400e">3. rules.&lt;artifactId&gt;</text>
  <text class="cell-t" x="54" y="372" fill="#78350f">Record&lt;id, string[]&gt;</text>

  <rect class="c-muted" x="284" y="326" width="172" height="64" rx="8"/>
  <text class="cell-h" x="370" y="350" text-anchor="middle" fill="#64748b">— 不进入</text>
  <text class="cell-t" x="370" y="372" text-anchor="middle" fill="#64748b">不改变 DAG 状态</text>

  <rect class="c-amber" x="464" y="326" width="208" height="64" rx="8"/>
  <text class="cell-h" x="568" y="350" text-anchor="middle" fill="#92400e">✓ &lt;rules&gt; 精确匹配</text>
  <text class="cell-t" x="568" y="372" text-anchor="middle" fill="#78350f">仅注入同名 artifactId</text>

  <rect class="c-red" x="680" y="326" width="184" height="64" rx="8"/>
  <text class="cell-h" x="772" y="350" text-anchor="middle" fill="#991b1b">✗ 绝不进入 apply！</text>
  <text class="cell-t" x="772" y="372" text-anchor="middle" fill="#7f1d1d">rules.apply 无消费者</text>

  <rect class="c-red" x="872" y="326" width="184" height="64" rx="8"/>
  <text class="cell-h" x="964" y="350" text-anchor="middle" fill="#991b1b">✗ 绝不进入 archive！</text>
  <text class="cell-t" x="964" y="372" text-anchor="middle" fill="#7f1d1d">仅内联 sync 取 specs</text>

  <rect class="c-amber" x="1064" y="326" width="176" height="64" rx="8"/>
  <text class="cell-h" x="1152" y="350" text-anchor="middle" fill="#92400e">✓ Explore 直读</text>
  <text class="cell-t" x="1152" y="372" text-anchor="middle" fill="#78350f">草拟对应制品时遵守</text>

  <!-- Row 4: operations (y=396..460, h=64) -->
  <rect class="c-purple" x="40" y="396" width="236" height="64" rx="8"/>
  <text class="cell-h" x="54" y="420" fill="#4c1d95">4. operations</text>
  <text class="cell-t" x="54" y="442" fill="#5b21b6">apply / archive .guidance</text>

  <rect class="c-muted" x="284" y="396" width="172" height="64" rx="8"/>
  <text class="cell-h" x="370" y="420" text-anchor="middle" fill="#64748b">— 不进入</text>
  <text class="cell-t" x="370" y="442" text-anchor="middle" fill="#64748b">不改变硬门控状态</text>

  <rect class="c-red" x="464" y="396" width="208" height="64" rx="8"/>
  <text class="cell-h" x="568" y="420" text-anchor="middle" fill="#991b1b">✗ 不进制品信封</text>
  <text class="cell-t" x="568" y="442" text-anchor="middle" fill="#7f1d1d">不属于 artifact 层</text>

  <rect class="c-purple" x="680" y="396" width="184" height="64" rx="8"/>
  <text class="cell-h" x="772" y="420" text-anchor="middle" fill="#4c1d95">✓ apply.guidance</text>
  <text class="cell-t" x="772" y="442" text-anchor="middle" fill="#5b21b6">返回 operationGuidance</text>

  <rect class="c-purple" x="872" y="396" width="184" height="64" rx="8"/>
  <text class="cell-h" x="964" y="420" text-anchor="middle" fill="#4c1d95">✓ archive.guidance</text>
  <text class="cell-t" x="964" y="442" text-anchor="middle" fill="#5b21b6">归档前提醒（非 CLI 闸）</text>

  <rect class="c-muted" x="1064" y="396" width="176" height="64" rx="8"/>
  <text class="cell-h" x="1152" y="420" text-anchor="middle" fill="#64748b">✗ Explore 不读</text>
  <text class="cell-t" x="1152" y="442" text-anchor="middle" fill="#64748b">无 operations.explore</text>

  <!-- Row 5: references (y=466..530, h=64) -->
  <rect class="c-green" x="40" y="466" width="236" height="64" rx="8"/>
  <text class="cell-h" x="54" y="490" fill="#14532d">5. references</text>
  <text class="cell-t" x="54" y="512" fill="#166534">渲染索引总长 ≤ 50KB</text>

  <rect class="c-muted" x="284" y="466" width="172" height="64" rx="8"/>
  <text class="cell-h" x="370" y="490" text-anchor="middle" fill="#64748b">— 不进入</text>
  <text class="cell-t" x="370" y="512" text-anchor="middle" fill="#64748b">不参与本地状态计算</text>

  <rect class="c-green" x="464" y="466" width="208" height="64" rx="8"/>
  <text class="cell-h" x="568" y="490" text-anchor="middle" fill="#14532d">✓ &lt;referenced_stores&gt;</text>
  <text class="cell-t" x="568" y="512" text-anchor="middle" fill="#166534">Purpose 首行只读索引</text>

  <rect class="c-green" x="680" y="466" width="184" height="64" rx="8"/>
  <text class="cell-h" x="772" y="490" text-anchor="middle" fill="#14532d">✓ references 索引</text>
  <text class="cell-t" x="772" y="512" text-anchor="middle" fill="#166534">不内联上游 spec 正文</text>

  <rect class="c-red" x="872" y="466" width="184" height="64" rx="8"/>
  <text class="cell-h" x="964" y="490" text-anchor="middle" fill="#991b1b">✗ 不进 archive</text>
  <text class="cell-t" x="964" y="512" text-anchor="middle" fill="#7f1d1d">归档仅处理本仓 delta</text>

  <rect class="c-green" x="1064" y="466" width="176" height="64" rx="8"/>
  <text class="cell-h" x="1152" y="490" text-anchor="middle" fill="#14532d">✓ doctor + context</text>
  <text class="cell-t" x="1152" y="512" text-anchor="middle" fill="#166534">健康检查与工作集发现</text>

  <!-- ==================== SECTION B: INFRA FIELDS (FIELDS 6-8) ==================== -->
  <rect class="panel" x="24" y="558" width="1232" height="220" rx="14"/>
  <text class="sec-h" x="40" y="584">B · 规划根寻址与工具交付配置（字段 6–8：不进入 AI 提示词，直接驱动 CLI 基础设施）</text>

  <!-- Row 6: store -->
  <rect class="c-orange" x="40" y="598" width="336" height="48" rx="8"/>
  <text class="flow-h" x="56" y="627" fill="#9a3412">6. store  （string · 外部 Store 指针）</text>
  <path class="arrow" d="M 376,622 L 414,622"/>
  <rect class="c-soft" x="416" y="598" width="824" height="48" rx="8"/>
  <text class="flow-t" x="434" y="627" fill="#1e293b">resolveOpenSpecRoot() → 仅在无本地 specs/ 与 changes/ 时指向外部注册 Store（坏指针硬阻断）</text>

  <!-- Row 7: skillsScope -->
  <rect class="c-blue" x="40" y="656" width="336" height="48" rx="8"/>
  <text class="flow-h" x="56" y="685" fill="#1e40af">7. skillsScope  （"project" | "global"）</text>
  <path class="arrow" d="M 376,680 L 414,680"/>
  <rect class="c-soft" x="416" y="656" width="824" height="48" rx="8"/>
  <text class="flow-t" x="434" y="685" fill="#1e293b">openspec update（及 init）→ 记住技能安装作用域（如记住 project 后，update 不再弹窗询问迁移）</text>

  <!-- Row 8: githubCopilot.cloudAgent -->
  <rect class="c-purple" x="40" y="714" width="336" height="48" rx="8"/>
  <text class="flow-h" x="56" y="743" fill="#4c1d95">8. githubCopilot.cloudAgent  （boolean）</text>
  <path class="arrow" d="M 376,738 L 414,738"/>
  <rect class="c-soft" x="416" y="714" width="824" height="48" rx="8"/>
  <text class="flow-t" x="434" y="743" fill="#1e293b">openspec init / openspec update → 控制是否生成并托管 .github/ 下的 GitHub Copilot 云端文件</text>

  <!-- ==================== BOTTOM BAR: FAIL-CLOSED VS FAIL-OPEN ==================== -->
  <rect class="c-red" x="24" y="790" width="1232" height="54" rx="10"/>
  <text class="cell-h" x="640" y="812" text-anchor="middle" fill="#991b1b">解析与校验双轨门禁：openspec validate 对坏 YAML / 不可读 config.yaml 直接报 ERROR 并 exit 1（#2127）；根解析对坏 store: 硬阻断</text>
  <text class="cell-t" x="640" y="834" text-anchor="middle" fill="#7f1d1d">其余命令走 readProjectConfig() 单字段容错告警（单字段超 50KB 或类型错仅忽略该字段；未知顶层键静默忽略、不报错也不生效）</text>
</svg>
