<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">内置 spec-driven 产物依赖 DAG 与四态判定机</title>
  <desc id="desc">左侧展示内置 spec-driven schema 中 proposal、specs、design、tasks 四个产物的依赖偏序与顶层 apply 阶段；右侧展示 ArtifactGraph 精确的 done、skipped、ready、blocked 四种状态判定规则，强调图模型不存在 optional 状态。</desc>
  <style>
    .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .panel-h { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .panel-sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .node-h { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace; }
    .node-t { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .code-t { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace; }
    .blue-box { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
    .green-box { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
    .purple-box { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.8; }
    .amber-box { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
    .orange-box { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.8; stroke-dasharray: 6,3; }
    .slate-box { fill: #f1f5f9; stroke: #475569; stroke-width: 1.8; }
    .red-box { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.8; }
    .notice-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.4; }
    .footer-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowSlate); }
    .edge-orange { stroke: #ea580c; stroke-width: 2; fill: none; marker-end: url(#arrowOrange); }
    .divider { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5,4; }
  </style>
  <defs>
    <marker id="arrowSlate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1238" height="758" rx="16"/>

  <!-- Header -->
  <text class="title" x="620" y="38" text-anchor="middle">内置 spec-driven 产物依赖 DAG 与四态判定机</text>
  <text class="subtitle" x="620" y="64" text-anchor="middle">ArtifactGraph 基于 requires 计算拓扑偏序与就绪态 · 磁盘文件存在性与 .openspec.yaml 驱动状态跃迁</text>

  <!-- ==================== LEFT PANEL: DAG ==================== -->
  <rect class="panel" x="24" y="84" width="644" height="606" rx="14"/>
  <text class="panel-h" x="46" y="114">A · 内置 spec-driven 依赖偏序（schemas/spec-driven/schema.yaml）</text>
  <text class="panel-sub" x="46" y="138">同级 ready 按 YAML 声明顺序稳定推荐：1. specs → 2. design（并行就绪，非串行依赖）</text>

  <!-- Node 1: proposal -->
  <rect class="blue-box" x="176" y="156" width="340" height="88" rx="10"/>
  <text class="node-h" x="346" y="182" text-anchor="middle" fill="#1e40af">proposal  →  proposal.md</text>
  <text class="code-t" x="346" y="206" text-anchor="middle" fill="#1d4ed8">requires: []  （入度 0 · 初始即 ready）</text>
  <text class="node-t" x="346" y="230" text-anchor="middle" fill="#1e3a8a">锚定 Why / What Changes / Capabilities 契约</text>

  <!-- Branch arrows from proposal -->
  <path class="edge" d="M 276,244 L 276,266 L 185,266 L 185,288"/>
  <path class="edge" d="M 416,244 L 416,266 L 503,266 L 503,288"/>

  <!-- Node 2L: specs -->
  <rect class="green-box" x="42" y="290" width="286" height="118" rx="10"/>
  <text class="node-h" x="185" y="316" text-anchor="middle" fill="#14532d">1. specs  →  specs/**/*.md</text>
  <text class="code-t" x="185" y="340" text-anchor="middle" fill="#15803d">requires: [proposal]（声明序 #1）</text>
  <text class="node-t" x="185" y="364" text-anchor="middle" fill="#166534">skip_specs: true 时置为 skipped</text>
  <text class="node-t" x="185" y="388" text-anchor="middle" fill="#166534">无文件亦计入完成集，解锁下游 tasks</text>

  <!-- Node 2R: design -->
  <rect class="purple-box" x="360" y="290" width="286" height="118" rx="10"/>
  <text class="node-h" x="503" y="316" text-anchor="middle" fill="#4c1d95">2. design  →  design.md</text>
  <text class="code-t" x="503" y="340" text-anchor="middle" fill="#6d28d9">requires: [proposal]（并行就绪）</text>
  <text class="node-t" x="503" y="364" text-anchor="middle" fill="#5b21b6">CLI 图模型无原生 optional 字段</text>
  <text class="node-t" x="503" y="388" text-anchor="middle" fill="#5b21b6">工作流模板支持显式条件跳过</text>

  <!-- Converge arrows to tasks -->
  <path class="edge" d="M 185,408 L 185,430 L 292,430 L 292,450"/>
  <path class="edge" d="M 503,408 L 503,430 L 400,430 L 400,450"/>

  <!-- Node 3: tasks -->
  <rect class="amber-box" x="176" y="452" width="340" height="88" rx="10"/>
  <text class="node-h" x="346" y="478" text-anchor="middle" fill="#92400e">tasks  →  tasks.md</text>
  <text class="code-t" x="346" y="502" text-anchor="middle" fill="#b45309">requires: [specs, design]（汇合节点）</text>
  <text class="node-t" x="346" y="526" text-anchor="middle" fill="#78350f">tasks.md 落盘即 done（不查 checkbox 勾选率）</text>

  <!-- Boundary between planning artifacts and apply phase -->
  <line class="divider" x1="46" y1="558" x2="646" y2="558"/>
  <text class="panel-sub" x="516" y="551" text-anchor="middle" fill="#64748b">独立顶层块（非第 5 个 artifact）</text>
  <path class="edge-orange" d="M 346,540 L 346,574"/>

  <!-- Node 4: apply phase -->
  <rect class="orange-box" x="96" y="576" width="500" height="94" rx="10"/>
  <text class="node-h" x="346" y="602" text-anchor="middle" fill="#9a3412">apply 阶段（schema.yaml 顶层 apply 块）</text>
  <text class="code-t" x="346" y="626" text-anchor="middle" fill="#c2410c">requires: [tasks]  ·  tracks: tasks.md</text>
  <text class="node-t" x="346" y="650" text-anchor="middle" fill="#9a3412">准入门只看 tasks.md 存在；内部再分 blocked / ready / all_done</text>

  <!-- ==================== RIGHT PANEL: 4 STATES ==================== -->
  <rect class="panel" x="688" y="84" width="528" height="606" rx="14"/>
  <text class="panel-h" x="710" y="114">B · ArtifactGraph 精确四态（formatChangeStatus）</text>

  <!-- No-optional callout -->
  <rect class="notice-box" x="710" y="128" width="484" height="36" rx="8"/>
  <text class="code-t" x="952" y="151" text-anchor="middle" fill="#334155">铁律：ArtifactGraph 仅有以下 4 种状态，不存在 optional 状态</text>

  <!-- State 1: done -->
  <rect class="green-box" x="710" y="180" width="484" height="110" rx="10"/>
  <text class="node-h" x="728" y="208" fill="#14532d">[x]  done  （已完成 · 绿色）</text>
  <text class="node-t" x="728" y="234" fill="#166534">判定：generates 在 changeDir 下匹配到 ≥1 个真实文件</text>
  <text class="node-t" x="728" y="258" fill="#166534">效应：计入 completed 集合，满足下游直接 requires；计入进度分子</text>

  <!-- State 2: skipped -->
  <rect class="slate-box" x="710" y="304" width="484" height="114" rx="10"/>
  <text class="node-h" x="728" y="332" fill="#1e293b">[~]  skipped  （显式跳过 · 灰色）</text>
  <text class="node-t" x="728" y="358" fill="#334155">判定：.openspec.yaml 设 skip_specs: true，且 generates 以</text>
  <text class="node-t" x="728" y="382" fill="#334155">      specs/ 开头且磁盘无文件 → 从分母剔除，并视为已满足前置</text>

  <!-- State 3: ready -->
  <rect class="amber-box" x="710" y="432" width="484" height="110" rx="10"/>
  <text class="node-h" x="728" y="460" fill="#92400e">[ ]  ready  （就绪可写 · 琥珀色）</text>
  <text class="node-t" x="728" y="486" fill="#78350f">判定：自身尚未完成，但所有直接 requires 均已 done 或 skipped</text>
  <text class="node-t" x="728" y="510" fill="#78350f">效应：进入 getNextArtifacts()，按声明顺序在 nextSteps 推荐</text>

  <!-- State 4: blocked -->
  <rect class="red-box" x="710" y="556" width="484" height="114" rx="10"/>
  <text class="node-h" x="728" y="584" fill="#991b1b">[-]  blocked  （前置阻塞 · 红色）</text>
  <text class="node-t" x="728" y="610" fill="#7f1d1d">判定：仍有至少一个直接 requires 未满足，输出 missingDeps 列表</text>
  <text class="node-t" x="728" y="634" fill="#7f1d1d">补充：若仅因条件跳过 design 阻塞 tasks，工作流层可直接拉取 tasks</text>

  <!-- Footer -->
  <rect class="footer-box" x="24" y="704" width="1192" height="40" rx="10"/>
  <text class="node-t" x="620" y="729" text-anchor="middle" fill="#334155">状态实时由磁盘文件与 .openspec.yaml 推导（零数据库、零锁文件）：落盘文件即 done，删除文件自动退回 ready / blocked。</text>
</svg>
