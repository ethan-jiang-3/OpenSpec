name: agent-dev-driven
version: 1
description: Agent 开发工作流——proposal → specs → design → tasks。和 spec-driven 同框架，交付物从代码换成 agent 组件

artifacts:
  - id: proposal
    generates: proposal.md
    description: Agent 提案——Why（为什么建这个 agent）、What Changes（能力与约束）、Capabilities（capability 清单）、Baseline Prompt
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this agent is needed, WHAT it will do, and what it MUST NOT do.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. Who is this agent for? What gap does it fill?
      - **What Changes**: Bullet list. New agent capabilities, modifications to existing behavior, or removals.
      - **Capabilities**: Identify which agent capabilities will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: Existing capabilities being changed. Each needs a delta spec.
      - **Constraints**: Hard boundaries the agent MUST NOT cross. What inputs or requests it must refuse (compliance, safety, out-of-scope). For each: trigger condition + refusal response template. Use a table.
      - **Baseline Prompt**: A "You are..." system-prompt paragraph distilled from Why, Capabilities, and Constraints. Downstream harnesses inject this directly as the agent's system prompt.
      - **Impact**: Affected harnesses, tools, existing skills, dependencies.

      IMPORTANT: The Capabilities section creates the contract between proposal and specs.
      Each capability listed here needs a corresponding spec file.
      Keep it concise (1-2 pages). Focus on "why" and "what" not "how"——implementation belongs in design.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Agent 能力规格——delta ops（ADDED/MODIFIED/REMOVED/RENAMED）Requirement+Scenario。和 spec-driven specs 完全同构
    template: spec.md
    instruction: |
      Create specification files that define WHAT the agent should do. Same delta-ops format as spec-driven specs——agent capabilities are spec-able.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (## headers):
      - **ADDED Requirements**: New agent capabilities
      - **MODIFIED Requirements**: Changed agent behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated capabilities - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Agent scenarios use the same WHEN/THEN format——replace system events with user inputs:
      ```
      #### Scenario: User asks for data export
      - **WHEN** user says "export my data"
      - **THEN** agent calls export tool and responds with a CSV download link
      ```

      Specs should be testable——each scenario is a potential eval case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Agent 实现方案——Skills/Commands/Tools/Evals/CLI 的完整设计。必写（不同于 spec-driven 的 optional）
    template: design.md
    instruction: |
      Create the design document that explains HOW to build the agent. Unlike spec-driven design (which is "create only if any apply"), this is **required** for every agent change——the agent IS its design.

      Sections:
      - **Context**: Background, target harness, constraints, existing agent state (check openspec/specs/ for current capabilities)
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Skills**: For each capability in specs, define the agent skill that implements it:
        - Skill name (maps to `skills/<name>.md`), trigger conditions, step-by-step plan
        - Input/output format, error handling per scenario, inter-skill collaboration
      - **Commands**: Slash-command design——if this change needs user-facing commands, define: command name (/agent:do-x), which skills it orchestrates and in what order, argument prelude, expected output. Skip if not needed.
      - **Tools**: Runtime tool/script design——if this change needs tools, define: tool name, input schema, return format, side effects, harness adapter notes (same tool may need different wrappers for OpenSpec vs Claude Code vs Cursor). Skip if not needed.
      - **Evals**: Behavior test plan——for each skill, define: normal path case, boundary case, refusal case. Each with concrete assertion method (grep/jq/file existence/exit code). Skip if not needed.
      - **CLI**: CLI surface design——if this agent is a CLI tool, define: binary name, subcommands mapped to skills, flags, status API (analogous to `openspec status --json`). Skip if not needed.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy

      Reference specs for what the agent must do, proposal for why and constraints.
      Not every section needs to be filled——only include sections for components this change actually needs.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Agent 构建清单——可跟踪的 checkbox 任务
    template: tasks.md
    instruction: |
      Create the task list that breaks down the agent build. Same checkbox format as spec-driven tasks——the apply phase parses `- [ ]` to track progress.

      **IMPORTANT: Follow the template format exactly.** Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency

      Task groups (adapt to what design.md actually includes——skip groups not needed):
      1. **Skills**: Write skill MD files per design's Skill definitions
      2. **Commands**: Write slash-command MD files per design's Command definitions
      3. **Tools**: Write tool scripts per design's Tool definitions
      4. **Evals**: Write eval case files per design's Eval plan
      5. **CLI**: Implement CLI entry point, subcommands, status API per design's CLI section
      6. **Harness Integration**: Copy skills/ and commands/ to target harness directories, register commands, run evals
      7. **End-to-End**: One real user intent walked end-to-end through the full agent

      Reference specs for what must be built, design for how to build it.
      Each task should be verifiable——you know when it's done.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read design.md and tasks.md. Build each agent component per the design, checking off tasks as you go.

    Readiness check before starting:
    1) Every component in design.md (skills/commands/tools/evals/CLI) has a corresponding task group in tasks.md
    2) Any component not included in design.md is intentionally absent——don't build it

    Build components:
    3) Skill MD files with YAML frontmatter (name, description, when-to-use)
    4) Slash-command MD files with proper frontmatter and argument prelude
    5) Tool scripts with executable entry (shebang for scripts, proper exports for JS)
    6) Eval case files with concrete, repeatable assertion commands
    7) CLI entry point and subcommands if design calls for it

    Harness integration:
    8) Copy skill files to target harness skill directory (e.g., .claude/skills/<name>/SKILL.md)
    9) Copy command files to target harness command directory (e.g., .claude/commands/opsx/<name>.md)
    10) Run all eval cases, record pass/fail——fix failures before continuing
    11) Walk one end-to-end path: a real user intent from input to expected output

    Definition of done: tasks.md all checked off, all evals pass, end-to-end path confirmed.
