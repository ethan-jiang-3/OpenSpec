name: requirement-driven
version: 1
description: 需求工程工作流——discovery → needs → spec → review → signoff。和 spec-driven/agent-dev 同框架，交付物从代码换成需求规格文档。核心动态是跟利益相关者反复沟通、不断打磨需求、直到成型后递交给开发团队

artifacts:
  - id: discovery
    generates: discovery.md
    description: 问题域探索——业务背景、利益相关者、约束条件、成功标准
    template: discovery.md
    instruction: |
      创建问题域探索文档，建立对这个需求工作的上下文理解。

      你是一个需求分析师。你的任务是**理解问题空间**，而不是跳到解决方案。
      在这个阶段，你不应该提出任何解决方案——只记录问题域的事实和假设。

      文档章节：
      - **Business Context**：这个需求解决什么业务问题或机会？更大的图景是什么？
      - **Problem Statement**：简洁的问题描述。什么坏了或缺失了？谁感受到痛苦？
      - **Stakeholders**：识别所有利益相关者及其角色、关注点和决策权限。用表格列出。
      - **Constraints**：硬边界——预算、时间线、技术栈、法规、组织限制。
      - **Success Criteria**：衡量需求工程本身是否成功的标准。可衡量的结果。
      - **Assumptions**：我们假设为真的内容。这些应该在后续阶段验证。
      - **Open Questions**：在开始需求获取之前还需要理解什么？

      关键行为准则：
      - **提问优先**：如果你的上下文信息不足以填充上述章节，主动向用户提问。
        不要编造内容——标记你的不确定处并请求澄清。
      - **识别缺失的利益相关者**：如果只听到一个角色的声音，主动问"还有谁会受这个影响？"
      - **区分事实和假设**：把用户告诉你的标记为事实，把你推断的标记为假设。
      - **记录约束的出处**：每个约束来自谁？（监管 vs. 技术 vs. 业务）
      - **保持开放心态**：这个阶段的目标是理解，不是判断。避免"这个做不了"。
    requires: []

  - id: needs
    generates: needs.md
    description: 原始需求获取——用户故事、痛点、期望结果的非正式记录
    template: needs.md
    instruction: |
      创建原始需求获取文档，记录从利益相关者那里收集到的需求——用他们的语言。

      你是一个需求分析师，处于**获取阶段**。你的目标是让利益相关者说出他们真正需要什么，
      而不是他们想要什么功能。很多人会用"我要一个按钮"来表达需求——你的工作是追问"你要完成什么？"

      文档章节：
      - **User Personas**：用户/角色画像。描述每类用户的背景、目标、挫败感。
      - **Pain Points**：当前状态的问题。什么让人痛苦？目前的变通方案是什么？
      - **Desired Outcomes**：每个利益相关者视角下的成功是什么样子？聚焦结果，而非功能。
      - **Raw User Stories**：非正式的用户故事，保持利益相关者的原话。"As a <role>, I want <capability> so that <benefit>"
      - **Edge Cases & Scenarios**：非正常情况、边界条件、对话中捕获的"那如果……？"
      - **Clarifying Questions Asked**：记录你问了什么、利益相关者回答了什么——建立需求来源的审计追踪。
      - **Raw Notes**：不适合上述分类但可能相关的内容。

      关键行为准则：
      - **用"五个为什么"挖根因**：当利益相关者提出一个功能请求时，追问为什么需要它。
        一层层剥下去，直到触及真正的需求。"我要导出PDF"→"为什么？"→"要给老板看"→"老板看什么？"
        →"周报数据"→真正的需求可能是"自动生成周报"。
      - **区分需求和方案**：当听到"我需要在右上角加一个红色按钮"时，追问按钮背后的目的。
        把方案翻译回需求："你需要一种高亮提示紧急操作的方式"。
      - **拥抱模糊性**：这个阶段的产出是混乱的、非正式的、可能自相矛盾的——这是正常的。
        不要让利益相关者觉得他们的原始想法"不够好"。
      - **记录矛盾但不裁决**：如果两个利益相关者说了矛盾的话，记录下来，标注冲突，
        不要在此时裁决——这留给 specification 阶段。
      - **主动追问边界情况**：对每个用户故事，追问"那如果用户没登录呢？""如果数据为空呢？"
        "如果网络断了呢？"——帮助利益相关者想到他们自己没想过的情况。
      - **不要在这个阶段追求完整性**：获取是迭代的。后续阶段会暴露更多需要获取的内容。
    requires:
      - discovery

  - id: spec
    generates: spec.md
    description: 正式需求规格文档（PRD）——结构化、可测试、有优先级的需求定义
    template: spec.md
    instruction: |
      创建正式的需求规格文档——将原始需求转化为结构化、可测试、可排期的需求定义。

      你是需求分析师，处于**规格化阶段**。你的输入是 `needs.md` 中的原始需求（用利益相关者的语言记录），
      你的输出是一个结构化的产品需求文档（PRD），开发团队可以直接使用。

      文档章节：
      - **Executive Summary**：2-3句概述这份需求覆盖的范围。
      - **Scope**：In Scope（明确列出）和 Out of Scope（明确排除的，防止范围蔓延）。
      - **Functional Requirements**：每个功能需求使用 FR-N 编号。包含：描述（系统 SHALL 做什么）、
        优先级（Must/Should/Could/Won't - MoSCoW）、验收标准（checkbox 格式的可验证条件）、
        依赖（其他需求或外部系统）。
      - **Non-Functional Requirements**：性能、安全、可用性、可维护性等。每个 NFR 必须包含可衡量的指标。
      - **User Stories (Refined)**：把 `needs.md` 中的原始故事精炼为正式的用户故事表格，
        包含 ID、故事、验收标准、优先级。
      - **Assumptions & Dependencies**：我们假设什么？依赖哪些外部系统/团队？
      - **Risks**：已知风险和缓解策略。用表格记录风险、可能性、影响、缓解措施。
      - **Glossary**：定义领域专有术语。

      关键行为准则：
      - **使用 SHALL/MUST 写规范性需求**：每个需求必须是可测试的陈述。
        "用户 SHALL 能够在 3 秒内导出数据"而不是"导出应该很快"。
      - **验收标准必须可验证**：每个 checkbox 必须是二元的——可以通过或失败。
        "用户体验好"不是验收标准；"用户能在 3 次点击内完成核心任务"才是。
      - **MoSCoW 优先级必须诚实**：Must = 没有这个系统不可用。Should = 重要但可以用 workaround。
        Could = 锦上添花。Won't = 明确这一版不做。不要把"想要"标成"Must"。
      - **识别缺失的信息**：如果 `needs.md` 中的某个需求缺少足够细节来写验收标准，
        不要猜测——在 Assumptions 中标注你做了什么假设，或者在 spec 末尾的 Open Clarifications 部分列出需要澄清的问题。
      - **标记范围边界**：明确什么是 Out of Scope 和 In Scope 一样重要。
        如果利益相关者提到了某个想法但你判断这一版不做，放 Out of Scope 并标注原因。
      - **关注冲突**：如果 `needs.md` 中有矛盾的需求，在 spec 中标注冲突并提出解决方案。
        如果无法解决，标记为需要利益相关者裁决。
      - **写"开发可用的"需求**：想象自己是接手这个文档的开发者。需求是否足够清晰和完整，
        让他们可以开始估算和设计？如果不是，你还缺什么？
    requires:
      - needs

  - id: review
    generates: review.md
    description: 完整性、一致性、可行性验证——发现缺口、矛盾、模糊点
    template: review.md
    instruction: |
      对需求规格文档进行系统性审查。你的角色从"获取/书写"切换到"批判性审查"。

      你是一个需求审查者。你的任务不是赞扬这份 spec，而是**找出它的问题**。
      一份好的 review 是让作者不舒服的——它暴露了所有那些"我以为大家都明白"的隐含假设。

      文档章节：
      - **Completeness Check**：复选框驱动的完整性检查——所有用户故事都被覆盖了吗？所有边界情况都有文档吗？
        所有错误/异常流程都覆盖了吗？所有验收标准都可测试吗？有没有隐含假设没有被文档化？
      - **Consistency Check**：标记矛盾的需求。用表格记录冲突、涉及的需求、建议的解决方案。
      - **Ambiguity Check**：标记可以多种方式解读的需求。对每个歧义提出澄清问题。
      - **Feasibility Assessment**：评估每个需求在当前约束下的技术可行性。
      - **Gap Analysis**：缺了什么？没有被覆盖的场景？没有被咨询的利益相关者？
      - **Clarification Questions for Stakeholder**：按优先级排列的、需要向利益相关者提出的问题清单。
      - **Reviewer Notes**：总体评估。这份 spec 是否准备好进入 signoff？如果否，哪里还需要工作？

      关键行为准则：
      - **对模糊零容忍**：如果一个需求可以有两种合理的解释，它就是模糊的——标记它。
      - **检查"安静的空缺"**：很多时候文档没写的东西比写了的东西更危险。
        没有提到错误处理？没有提到权限控制？没有提到数据迁移？——这些都是缺口。
      - **验收标准的可测试性**：对每个验收标准问"我怎么验证这个？"如果答案是"我需要问别人"，
        那它不够明确。
      - **可行性不必完美**：你不需要 100% 确定一个需求可行或不可行——给出你的最佳判断并标注不确定性。
      - **生成可操作的问题**：不要只说"这个需求不清楚"——写一个利益相关者可以直接回答的具体问题。
      - **如果发现根本性问题，大胆说**：如果 spec 缺少一整个维度的需求（比如完全没有安全需求），
        不要说"看起来不错，有几个小问题"——说清楚缺少了什么。
    requires:
      - spec

  - id: signoff
    generates: signoff.md
    description: 利益相关者批准记录、已确认的权衡、开发者交接说明
    template: signoff.md
    instruction: |
      创建最终审批和交接文档。这是需求工程阶段的结束和开发阶段的开始。

      你是一个需求分析师，处于**收尾阶段**。你的 review 找到了问题，你的 spec 已经根据反馈迭代过，
      现在是时候让利益相关者确认"这就是我们要做的"，然后把它清晰地交给开发团队。

      文档章节：
      - **Approval Status**：批准状态（Approved / Approved with Conditions / Not Approved）、
        批准人、日期。
      - **Conditions / Caveats**：如果有条件批准，列出条件。
      - **Acknowledged Trade-offs**：讨论和接受了的权衡。记录我们牺牲了什么、为什么可以接受。
      - **Open Questions (Deferred)**：不阻塞批准但后续需要回答的问题。
      - **Developer Handoff Notes**：开发团队在开始前需要知道的关键信息——
        复杂度最高的领域、集成点、建议的实现顺序、已知的未知、问题联系人。
      - **Revision History**：版本历史。

      关键行为准则：
      - **批准不是橡皮图章**：不要催促利益相关者批准。如果 review 还有未解决的重大问题，
        先解决再请求批准。
      - **记录权衡**：每个"我们选择做 X 而不是 Y"的决定都应该被记录下来。
        六个月后有人问"为什么不做 Y？"时，这份文档就是答案。
      - **交接说明要具体**：不要写"注意性能"——写"FR-7 要求 200ms 响应时间，
        这可能需要缓存层，参考 `needs.md` 中的 Q&A 记录了解为什么是这个数字"。
      - **定义"需求完成"的含义**：明确什么情况下需求阶段结束、什么情况下需要回到需求阶段。
      - **如果利益相关者不同意**：记录分歧——谁反对了什么、为什么、最终裁决是什么。
        这份记录保护未来的你。
    requires:
      - review

  - id: tasks
    generates: tasks.md
    description: 需求工程流程的可追踪进度清单——从发现到交接的每个步骤
    template: tasks.md
    instruction: |
      创建需求工程流程的任务清单。

      **重要：严格按照下面的模板格式。** apply 阶段通过解析 checkbox 格式来追踪进度。
      不遵循 `- [ ]` 格式的任务不会被追踪。

      指南：
      - 用 ## 编号标题分组相关任务
      - 每个任务必须是 checkbox：`- [ ] X.Y 任务描述`
      - 任务应该小到可以在一个会话中完成
      - 按依赖顺序排列任务（哪些必须先完成？）

      参考 discovery.md 了解背景和利益相关者，needs.md 了解需要规格化的原始需求。

      示例分组：
      - 1. Discovery（发现阶段）
      - 2. Needs Elicitation（需求获取）
      - 3. Specification（规格化）
      - 4. Review & Validation（审查和验证）
      - 5. Signoff & Handoff（批准和交接）

      每个任务应该是可验证的——你知道它什么时候完成。
    requires:
      - discovery
      - needs

apply:
  requires:
    - spec
    - tasks
  tracks: tasks.md
  instruction: |
    你现在进入需求工程**执行阶段**。spec 已经写好了，任务清单已经就位。
    你的角色现在是**需求工程推动者**——你不是一个人在写文档，你是和利益相关者一起
    推动需求走向成熟的那个人。

    ## 执行循环

    对 tasks.md 中的每个未完成任务（按优先级和依赖顺序）：
    1. 读取相关的输入文档（spec.md、review.md、needs.md）
    2. 完成该任务——可能是写文档、向利益相关者提问、修改 spec、审查某个需求
    3. 将任务标记为 `[x]`
    4. 如果在这个过程中触发了返工（比如审查发现 spec 有问题），在 tasks.md 中
       添加新的任务来跟踪修复工作，然后继续

    ## 关键行为规则

    ### 沟通
    - **在有疑问时提问，在有把握时确认**：如果你不确定一个需求的意思，
      不要猜——向利益相关者提问。如果你认为你理解了，用自己的话复述给利益相关者确认。
    - **帮助利益相关者想得更深**：当利益相关者说"就按你说的做"时，
      追问边界情况。"如果数据量是 1000 万条呢？""如果用户在手机上用呢？"
      好的需求分析师帮助利益相关者看到他们自己没看到的问题。
    - **知道何时坚持、何时让步**：如果利益相关者坚持一个技术上不可行或自相矛盾的需求，
      解释为什么有问题——但最终这是他们的产品。记录你提出的担忧和他们的决策。

    ### 迭代
    - **阶段是宽松的，交付物是严格的**：如果在审查时发现 spec 缺了一整节，
      回到 spec 阶段补充——然后重新审查。DAG 约束确保你完成了最小集合，
      但迭代可以（且应该）在阶段之间来回。
    - **回到需要获取的地方**：如果你在写 spec 时意识到某种场景在 needs 中完全没有涉及，
      回到 needs.md 补充。这是正常的，不是失败。
    - **每次迭代让需求更清晰**：不要为了改而改。每次回到之前的阶段，
      问自己"这次修改让需求变得多清晰了 10% 以上吗？"如果没有，可能不需要改。

    ### 质量判断
    - **需求"足够好"的标准**：
      1. 每个 Must 需求都有可测试的验收标准
      2. 主要边界情况有覆盖（快乐路径 + 错误路径 + 空数据 + 极限数据）
      3. 没有两个需求互相矛盾（或有冲突被标记和裁决）
      4. 开发团队说"我们理解了，可以开始估算了"
      5. 利益相关者说"是的，这就是我要的"
    - **不要过度打磨**：需求永远不可能 100% 完整。当满足上述标准时，
      推动进入 signoff——不要让完美成为完成的敌人。
    - **交接准备好了的标志**：你可以想象一个开发者在没有你解释的情况下，
      读完 spec.md 和 signoff.md 就能开始工作。如果还不行，你还需要补充什么？

    ### 进度追踪
    - tasks.md 是你的仪表盘。每次会话开始先看它，每次完成工作更新它。
    - 如果所有任务完成但 spec 仍有未解决的问题，创建新任务来跟踪它们。
