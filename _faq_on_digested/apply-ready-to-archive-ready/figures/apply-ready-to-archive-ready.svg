<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="cli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="fs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <style>
      .box { stroke-width: 1.2; rx: 8; }
      .label { fill: #0f172a; font-weight: 700; }
      .small { fill: #475569; font-size: 12px; }
      .tiny { fill: #64748b; font-size: 11px; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #f59e0b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Apply 如何走到 Archive-Ready</text>
  <text x="590" y="58" text-anchor="middle" class="small">CLI 给出 context/task state，agent 实施代码并更新 checkbox，全部完成后交给 archive</text>

  <rect x="70" y="95" width="230" height="72" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="185" y="122" text-anchor="middle" class="label">APP-01 select change</text>
  <text x="185" y="146" text-anchor="middle" class="small">指定 / 推断 / 选择</text>

  <rect x="360" y="95" width="230" height="72" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="475" y="122" text-anchor="middle" class="label">APP-02 status check</text>
  <text x="475" y="146" text-anchor="middle" class="small">status --json</text>

  <rect x="650" y="95" width="230" height="72" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="765" y="122" text-anchor="middle" class="label">APP-03 apply instructions</text>
  <text x="765" y="146" text-anchor="middle" class="small">instructions apply --json</text>

  <path d="M300,131 L360,131" class="arrow"/>
  <path d="M590,131 L650,131" class="arrow"/>

  <rect x="460" y="235" width="260" height="88" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="590" y="265" text-anchor="middle" class="label">APP-04 state branch</text>
  <text x="590" y="290" text-anchor="middle" class="small">blocked / ready / all_done</text>
  <text x="590" y="306" text-anchor="middle" class="tiny">ready 才进入实施</text>

  <path d="M765,167 C765,205 590,205 590,235" class="arrow"/>

  <rect x="75" y="390" width="240" height="78" class="box" fill="url(#fs)" stroke="#fdba74"/>
  <text x="195" y="418" text-anchor="middle" class="label">APP-05 read contextFiles</text>
  <text x="195" y="442" text-anchor="middle" class="small">proposal / specs / design / tasks</text>

  <rect x="350" y="390" width="220" height="78" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="460" y="418" text-anchor="middle" class="label">APP-06 show progress</text>
  <text x="460" y="442" text-anchor="middle" class="small">N/M complete</text>

  <rect x="605" y="390" width="220" height="78" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="715" y="418" text-anchor="middle" class="label">APP-07 pick pending task</text>
  <text x="715" y="442" text-anchor="middle" class="small">next unchecked task</text>

  <rect x="860" y="390" width="240" height="78" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="980" y="418" text-anchor="middle" class="label">APP-08 implement code</text>
  <text x="980" y="442" text-anchor="middle" class="small">最小、聚焦修改</text>

  <path d="M590,323 C590,360 195,360 195,390" class="arrow"/>
  <path d="M315,429 L350,429" class="arrow"/>
  <path d="M570,429 L605,429" class="arrow"/>
  <path d="M825,429 L860,429" class="arrow"/>

  <rect x="735" y="550" width="250" height="78" class="box" fill="url(#fs)" stroke="#fdba74"/>
  <text x="860" y="578" text-anchor="middle" class="label">APP-09 update checkbox</text>
  <text x="860" y="602" text-anchor="middle" class="small">- [ ] -> - [x]</text>

  <rect x="420" y="550" width="250" height="78" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="545" y="578" text-anchor="middle" class="label">APP-10 loop/re-read progress</text>
  <text x="545" y="602" text-anchor="middle" class="small">刷新 tasks/progress</text>

  <rect x="105" y="550" width="250" height="78" class="box" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="230" y="578" text-anchor="middle" class="label">APP-11 pause guard</text>
  <text x="230" y="602" text-anchor="middle" class="small">不清楚 / 阻塞 / workspace</text>

  <path d="M980,468 C980,520 860,520 860,550" class="arrow"/>
  <path d="M735,589 L670,589" class="arrow"/>
  <path d="M545,550 C545,500 715,500 715,468" class="loop"/>
  <path d="M715,468 C715,520 230,520 230,550" class="arrow"/>

  <rect x="235" y="725" width="230" height="74" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="350" y="753" text-anchor="middle" class="label">APP-12 all tasks done</text>
  <text x="350" y="777" text-anchor="middle" class="small">progress remaining = 0</text>

  <rect x="515" y="725" width="230" height="74" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="630" y="753" text-anchor="middle" class="label">APP-13 final summary</text>
  <text x="630" y="777" text-anchor="middle" class="small">完成 / 验证 / 风险</text>

  <rect x="795" y="725" width="230" height="74" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="910" y="753" text-anchor="middle" class="label">APP-14 archive-ready handoff</text>
  <text x="910" y="777" text-anchor="middle" class="small">建议 /opsx:archive</text>

  <path d="M545,628 C545,690 350,690 350,725" class="arrow"/>
  <path d="M465,762 L515,762" class="arrow"/>
  <path d="M745,762 L795,762" class="arrow"/>

  <text x="590" y="838" text-anchor="middle" class="tiny">pause guard 会停止实施并汇报原因；all tasks done 才进入 archive-ready，但不会自动 archive</text>
</svg>
