name: agent-dev-driven
version: 1
description: Agent 开发工作流——proposal → specs → design → tasks。和 spec-driven 同框架，交付物从代码换成 agent 组件

artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `data-export`, `refund-handling`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected skills, commands, tools, harnesses, or dependencies.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how"——
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the agent should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from <planningHome.root>/openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in <planningHome.root>/openspec/specs/<capability>/spec.md using the resolved planning home from instructions/status
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The agent SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user says "export my data"
      - **THEN** agent calls export tool and responds with a CSV download link
      ```

      Specs should be testable - each scenario is a potential eval case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Agent 实现方案——Skills/Commands/Tools/Evals/CLI 的完整设计。必写（不同于 spec-driven 的 optional）
    template: design.md
    instruction: |
      Create the design document that explains HOW to build the agent. Unlike spec-driven design (which is "create only if any apply"), this is **required** for every agent change——the agent IS its design.

      Sections:
      - **Context**: Background, target harness, constraints, existing agent state (check openspec/specs/ for current capabilities)
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Skills**: For each capability in specs, define the agent skill that implements it:
        - Skill name (maps to `skills/<name>.md`), trigger conditions, step-by-step plan
        - Input/output format, error handling per scenario, inter-skill collaboration
      - **Commands**: Slash-command design——if this change needs user-facing commands, define: command name (/agent:do-x), which skills it orchestrates and in what order, argument prelude, expected output. Skip if not needed.
      - **Tools**: Runtime tool/script design——if this change needs tools, define: tool name, input schema, return format, side effects, harness adapter notes (same tool may need different wrappers for OpenSpec vs Claude Code vs Cursor). Skip if not needed.
      - **Evals**: Behavior test plan——for each skill, define: normal path case, boundary case, refusal case. Each with concrete assertion method (grep/jq/file existence/exit code). Skip if not needed.
      - **CLI**: CLI surface design——if this agent is a CLI tool, define: binary name, subcommands mapped to skills, flags, status API (analogous to `openspec status --json`). Skip if not needed.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy

      Reference specs for what the agent must do, proposal for why and constraints.
      Not every section needs to be filled——only include sections for components this change actually needs.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Every checkbox task MUST include its own verification: a test, command,
        observable behavior, or artifact inspection
      - Use a separate Integration Verification task only when the check spans
        multiple implementation tasks

      Example:
      ```
      ## 1. Skills

      - [ ] 1.1 Write skills/data-export.md per design Skill definitions — verify: inspect the file against the skill contract
      - [ ] 1.2 Write skills/refund-handling.md per design Skill definitions — verify: run the normal and refusal eval prompts

      ## 2. Commands

      - [ ] 2.1 Write commands/export.md per design Command definitions — verify: invoke the command with sample arguments

      ## 3. Harness Integration

      - [ ] 3.1 Copy skill files to target harness directory — verify: list the installed files
      - [ ] 3.2 Copy command files to target harness directory — verify: list the installed commands
      - [ ] 3.3 Run eval cases — verify: all expected assertions pass
      ```

      Reference specs for what needs to be built, design for how to build it.
      Verification is part of each task, not an optional final reminder.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read design.md and tasks.md. Work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

    For agent changes, this means: write skill MD files, slash-command MD files, tool scripts,
    eval case files, and CLI entry points per the design. Copy deliverables to the target
    harness directory (e.g., .claude/skills/, .claude/commands/). Run evals and verify.
    Walk one end-to-end path from user input to expected output.
