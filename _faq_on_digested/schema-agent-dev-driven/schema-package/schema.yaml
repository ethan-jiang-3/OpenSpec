name: agent-dev-driven
version: 1
description: AI Agent 开发工作流——交付 charter/skills/commands/tools/evals/cli 这组 harness 可消费的组件

artifacts:
  - id: charter
    generates: charter.md
    description: Agent 角色定义——身份、能力、边界、系统立场
    template: charter.md
    instruction: |
      定义 Agent 的角色和行为边界：

      - Agent 的名字、身份、专业领域（一句话能说清「它是谁、为谁服务」）
      - 核心能力范围：能做什么——列出可调用的 skill 与外部工具清单
      - 行为边界：不能做什么——什么输入必须拒绝（合规、安全、越界请求），并给出拒绝话术模板
      - 沟通风格与语气：默认回复结构、详细度、何时主动追问、何时保持沉默
      - 系统立场（system-prompt）：以「你是…」开头的整段立场陈述，供下游 harness 直接消费或 adapter 渲染
      - 用户画像：服务对象是谁、典型任务的上下文假设
    requires: []

  - id: skills
    generates: skills/**/*.md
    description: Skill 定义（Markdown 格式，harness 自动发现）
    template: skill.md
    instruction: |
      基于 charter.md，为 Agent 定义技能。每个 skill 一个 Markdown 文件，放在 skills/ 目录下。

      - frontmatter：name（skill 名）、description（一句话用途）、when-to-use（触发语义）
      - 正文：触发条件（什么情况下 Agent 应激活这个 skill）
      - 分步执行步骤（Step 1/2/3…，每步做什么、产出什么）
      - 输入输出格式（输入参数 schema、输出格式 schema）
      - 错误处理与边界情况（输入残缺、工具失败、权限不足时怎么做）
      - 与其他 skill 的协作方式（显式声明依赖或调用关系，用 skill 文件名引用）
    requires:
      - charter

  - id: commands
    generates: commands/**/*.md
    description: Slash-command 定义（Markdown 格式，用户可调用）
    template: command.md
    instruction: |
      基于 skills/ 下的 skill，为 Agent 定义用户可调用的 slash-command。每个 command 一个 Markdown 文件，放在 commands/ 目录下。

      - frontmatter：命令名（如 /my-agent:do-x）、一句话用途、参数说明（$ARGUMENTS 或结构化入参）
      - 正文：命令体——把若干 skill 串成一条用户意图工作流
      - 显式标注调用了哪些 skill（引用 skills/ 下的文件名）
      - 预检：命令启动前需满足的条件（前置 artifact、环境依赖）
      - 成功/失败的预期输出形态（用户会看到什么、下一步是什么）
    requires:
      - skills

  - id: tools
    generates: tools/**/*
    description: 运行时工具/脚本——agent 调用的执行层
    template: tool.md
    instruction: |
      定义 Agent 在运行时调用的工具和脚本。每个工具一个文件，放在 tools/ 目录下（Python/Shell/JS/JSON tool-schema 均可）。

      - 工具名称、入参 schema（JSON Schema 或结构化自然语言描述）
      - 返回格式（JSON 结构、exit code、stdout/stderr 语义）
      - 副作用说明（读写文件、网络调用、状态变更）
      - 运行时契约：如果该 agent 依赖 OpenSpec CLI，列出会调用的 openspec 命令（如 `openspec status --json`、`openspec instructions --json`），给出调用顺序与失败处理
      - 反向索引：标注被哪个 skill/command 使用（引用文件路径）
      - 适配说明：同一工具在不同 harness（OpenSpec / Claude Code / Cursor）下的交付差异（文件位置、frontmatter 格式等）
    requires:
      - skills

  - id: evals
    generates: evals/**/*.md
    description: 行为测试用例（形状断言，非模型 eval）
    template: eval.md
    instruction: |
      为每个 skill 编写行为测试用例。每个 eval 文件对应一个 skill 文件，放在 evals/ 目录下。

      - 三类用例（每个用例：输入 + 期望断言）：
        1. 正常路径：给定标准输入 → 期望输出（断言产物形状/字段/关键值）
        2. 边界情况：残缺输入/超长输入/歧义输入 → 期望行为（降级/追问/拒绝）
        3. 拒绝场景：越界输入 → 期望拒绝理由（匹配 charter 里定义的拒绝话术）
      - 断言方式：针对 Agent 产物的形状和字段（文件存在性、JSON 字段、关键词匹配、exit code）——不依赖 LLM as-judge，可重复执行
      - 标注每条用例验证的是哪个 skill/command
      - 可重复判定：给出具体判定命令（grep、jq、diff、test -f 等）
    requires:
      - skills

  - id: cli
    generates: cli.md
    description: Agent 的命令行界面——入口、子命令、状态 API
    template: cli.md
    instruction: |
      定义 Agent 自己的命令行界面——用户如何调用它、它对外暴露什么接口。

      - 二进制/入口名（如 `my-agent`），安装方式（npm link、pip install -e .、直接脚本）
      - 子命令列表：每个子命令对应一个 skill，参数映射到 skill 的输入
      - flags / options（全局和子命令级）
      - 状态读取 API：Agent 对外暴露的结构化状态接口（类比 `openspec status --json`、`openspec instructions --json`），供其他工具或上层 orchestrator 查询
      - 退出码约定（0=成功、非 0 的语义）
      - 安装/打包说明（目标平台、依赖）
    requires:
      - skills

  - id: tasks
    generates: tasks.md
    description: 接入与发布清单——可勾选的进度跟踪
    template: tasks.md
    instruction: |
      把 Agent 的上线准备拆成可勾选的清单。用 `- [ ]` / `- [x]` 格式，OpenSpec CLI 会解析为进度。

      - 每个 skill 至少一条「已接入 harness」（skills/ 下的文件渲染/拷贝到目标 harness 的约定目录）
      - 每个 command 至少一条「已注册并可被用户调用」（commands/ 下的文件就位）
      - 每个 tool 至少一条「已可执行」（脚本有正确入口、dry-run 通过）
      - 每条 eval 至少一条「已运行并通过」
      - cli 就绪：「入口可调用、--help 正常输出、状态 API 返回有效 JSON」
      - 末尾一条端到端任务：从一个真实用户意图出发，走完 charter → skill → command → tool → eval → cli 全链路
    requires:
      - skills
      - commands
      - tools
      - evals
      - cli

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    就绪检查（readiness gate）：
    1) 每个 skill 都有对应的 command 和 eval（skill↔command↔eval 三者齐全，不漏不重）
    2) 每个 tool 都可执行（脚本有正确入口、dry-run 不出错）
    3) cli 入口可调用、--help 正常、状态 API 返回合法 JSON
    4) 所有 evals 通过

    集成（integration）：
    5) 把 skills/ 和 commands/ 下的文件渲染/拷贝到目标 harness 的约定目录（如 .claude/skills/、.claude/commands/）
    6) 跑一遍 evals，记录通过/失败

    完成定义（Definition of done）：
    - tasks.md 全部勾选完成
    - 至少一条端到端用例从用户输入到预期输出跑通
