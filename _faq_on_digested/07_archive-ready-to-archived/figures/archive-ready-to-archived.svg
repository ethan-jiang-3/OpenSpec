<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <linearGradient id="cli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="fs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <style>
      .box { stroke-width: 1.2; rx: 8; }
      .label { fill: #0f172a; font-weight: 700; }
      .small { fill: #475569; font-size: 12px; }
      .tiny { fill: #64748b; font-size: 11px; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .side { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="940" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Archive-Ready 如何走到 Archived</text>
  <text x="590" y="58" text-anchor="middle" class="small">CLI 主线：validate / merge specs / move change；OPSX 是模板层旁路</text>

  <rect x="60" y="95" width="230" height="72" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="175" y="122" text-anchor="middle" class="label">ARC-01 select change</text>
  <text x="175" y="146" text-anchor="middle" class="small">argument or interactive select</text>

  <rect x="340" y="95" width="230" height="72" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="455" y="122" text-anchor="middle" class="label">ARC-02 verify change dirs</text>
  <text x="455" y="146" text-anchor="middle" class="small">changesDir / changeDir</text>

  <rect x="620" y="95" width="230" height="72" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="735" y="122" text-anchor="middle" class="label">ARC-03 validation pass</text>
  <text x="735" y="146" text-anchor="middle" class="small">proposal warning / delta errors</text>

  <rect x="900" y="95" width="230" height="72" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="1015" y="122" text-anchor="middle" class="label">ARC-04 task progress warning</text>
  <text x="1015" y="146" text-anchor="middle" class="small">tasks.md checkbox count</text>

  <path d="M290,131 L340,131" class="arrow"/>
  <path d="M570,131 L620,131" class="arrow"/>
  <path d="M850,131 L900,131" class="arrow"/>

  <rect x="60" y="245" width="230" height="78" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="175" y="274" text-anchor="middle" class="label">ARC-05 find spec updates</text>
  <text x="175" y="298" text-anchor="middle" class="small">change/specs -> main specs</text>

  <rect x="340" y="245" width="230" height="78" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="455" y="274" text-anchor="middle" class="label">ARC-06 confirm spec updates</text>
  <text x="455" y="298" text-anchor="middle" class="small">unless --yes / skip</text>

  <rect x="620" y="245" width="230" height="78" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="735" y="274" text-anchor="middle" class="label">ARC-07 prepare rebuilt specs</text>
  <text x="735" y="298" text-anchor="middle" class="small">buildUpdatedSpec all first</text>

  <rect x="900" y="245" width="230" height="78" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="1015" y="274" text-anchor="middle" class="label">ARC-08 apply delta operations</text>
  <text x="1015" y="298" text-anchor="middle" class="small">rename / remove / modify / add</text>

  <path d="M1015,167 C1015,210 175,205 175,245" class="arrow"/>
  <path d="M290,284 L340,284" class="arrow"/>
  <path d="M570,284 L620,284" class="arrow"/>
  <path d="M850,284 L900,284" class="arrow"/>

  <rect x="200" y="405" width="250" height="78" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="325" y="434" text-anchor="middle" class="label">ARC-09 validate rebuilt specs</text>
  <text x="325" y="458" text-anchor="middle" class="small">validateSpecContent before write</text>

  <rect x="505" y="405" width="250" height="78" class="box" fill="url(#fs)" stroke="#fdba74"/>
  <text x="630" y="434" text-anchor="middle" class="label">ARC-10 write main specs</text>
  <text x="630" y="458" text-anchor="middle" class="small">openspec/specs/*/spec.md</text>

  <rect x="810" y="405" width="250" height="78" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="935" y="434" text-anchor="middle" class="label">ARC-11 archive target check</text>
  <text x="935" y="458" text-anchor="middle" class="small">YYYY-MM-DD-name exists?</text>

  <path d="M1015,323 C1015,370 325,365 325,405" class="arrow"/>
  <path d="M450,444 L505,444" class="arrow"/>
  <path d="M755,444 L810,444" class="arrow"/>

  <rect x="260" y="570" width="250" height="78" class="box" fill="url(#fs)" stroke="#fdba74"/>
  <text x="385" y="599" text-anchor="middle" class="label">ARC-12 move change dir</text>
  <text x="385" y="623" text-anchor="middle" class="small">rename or copy + remove</text>

  <rect x="565" y="570" width="250" height="78" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="690" y="599" text-anchor="middle" class="label">ARC-13 archive summary</text>
  <text x="690" y="623" text-anchor="middle" class="small">archived as date-name</text>

  <rect x="870" y="570" width="250" height="78" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="995" y="599" text-anchor="middle" class="label">ARC-14 archived handoff</text>
  <text x="995" y="623" text-anchor="middle" class="small">baseline updated / change inactive</text>

  <path d="M935,483 C935,535 385,535 385,570" class="arrow"/>
  <path d="M510,609 L565,609" class="arrow"/>
  <path d="M815,609 L870,609" class="arrow"/>

  <rect x="100" y="735" width="980" height="112" class="box" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="590" y="765" text-anchor="middle" class="label">/opsx:archive template layer</text>
  <text x="590" y="790" text-anchor="middle" class="small">status --json -> workspace guard -> delta sync assessment -> optional openspec-sync-specs -> move</text>
  <text x="590" y="814" text-anchor="middle" class="tiny">这是 agent delivery path，不是 ArchiveCommand.execute() 的内部步骤</text>

  <path d="M930,648 C930,700 590,700 590,735" class="side"/>

  <text x="590" y="890" text-anchor="middle" class="tiny">build failures stop before writes; rebuilt validation and writes are per spec, with no transaction rollback after writes begin</text>
</svg>
