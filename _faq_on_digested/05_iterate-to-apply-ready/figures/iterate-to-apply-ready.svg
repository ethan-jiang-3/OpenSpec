<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="cli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="fs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="explore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <style>
      .box { stroke-width: 1.2; rx: 8; }
      .label { fill: #0f172a; font-weight: 700; }
      .small { fill: #475569; font-size: 12px; }
      .tiny { fill: #64748b; font-size: 11px; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #f59e0b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="780" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Iterate 如何走到真正 Apply-Ready</text>
  <text x="590" y="58" text-anchor="middle" class="small">propose 产出 artifacts → Explore 审视 → 代码校验 → 发现 gap → 修复 → 重审 → 真正可实施</text>

  <!-- Row 1: Entry -->
  <rect x="80" y="95" width="280" height="76" class="box" fill="url(#fs)" stroke="#fdba74"/>
  <text x="220" y="122" text-anchor="middle" class="label">ITR-01 mechanical apply-ready</text>
  <text x="220" y="144" text-anchor="middle" class="small">propose 刚完成 · artifacts 存在</text>
  <text x="220" y="160" text-anchor="middle" class="tiny">apply gate 通过，但内容未必可实施</text>

  <rect x="440" y="95" width="280" height="76" class="box" fill="url(#explore)" stroke="#c4b5fd"/>
  <text x="580" y="122" text-anchor="middle" class="label">ITR-02 进入 Explore stance</text>
  <text x="580" y="144" text-anchor="middle" class="small">从 produce 切换到 critique</text>
  <text x="580" y="160" text-anchor="middle" class="tiny">不生成新 artifact，严格审视已有内容</text>

  <rect x="800" y="95" width="300" height="76" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="950" y="122" text-anchor="middle" class="label">ITR-03 批判性阅读 artifacts</text>
  <text x="950" y="144" text-anchor="middle" class="small">proposal / specs / design / tasks</text>
  <text x="950" y="160" text-anchor="middle" class="tiny">scope 准吗？scenario 可测吗？tasks 可执行吗？</text>

  <path d="M360,133 L440,133" class="arrow"/>
  <path d="M720,133 L800,133" class="arrow"/>

  <!-- Row 2: Cross-check -->
  <rect x="80" y="240" width="340" height="92" class="box" fill="url(#cli)" stroke="#86efac"/>
  <text x="250" y="268" text-anchor="middle" class="label">ITR-04 真实代码校验</text>
  <text x="250" y="292" text-anchor="middle" class="small">rg 搜索 + 读入口/模块/测试/数据模型</text>
  <text x="250" y="310" text-anchor="middle" class="tiny">逐项对照：artifact 声称 ⇔ 代码事实</text>

  <rect x="500" y="240" width="340" height="92" class="box" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="670" y="268" text-anchor="middle" class="label">ITR-05 发现 + 分类 gap</text>
  <text x="670" y="292" text-anchor="middle" class="small">scope 偏差 / specs 不完整 / design 假设被推翻</text>
  <text x="670" y="310" text-anchor="middle" class="tiny">tasks 太粗 / artifacts 间不一致 / 遗漏 artifact</text>

  <rect x="920" y="240" width="200" height="92" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="1020" y="268" text-anchor="middle" class="label">ITR-06 修 gap</text>
  <text x="1020" y="292" text-anchor="middle" class="small">直接编辑 / continue</text>
  <text x="1020" y="310" text-anchor="middle" class="tiny">回 explore / 拆 change</text>

  <path d="M950,171 C950,205 250,205 250,240" class="arrow"/>
  <path d="M420,286 L500,286" class="arrow"/>
  <path d="M840,286 L920,286" class="arrow"/>

  <!-- Row 3: Loop + Decision -->
  <rect x="120" y="410" width="300" height="88" class="box" fill="url(#explore)" stroke="#c4b5fd"/>
  <text x="270" y="440" text-anchor="middle" class="label">ITR-07 重审循环</text>
  <text x="270" y="464" text-anchor="middle" class="small">修完回到 ITR-03 再审一轮</text>
  <text x="270" y="482" text-anchor="middle" class="tiny">通常 1-3 轮；超过 3 轮说明最初收敛不够</text>

  <rect x="540" y="410" width="260" height="88" class="box" fill="url(#gate)" stroke="#facc15"/>
  <text x="670" y="440" text-anchor="middle" class="label">ITR-08 真正 apply-ready?</text>
  <text x="670" y="464" text-anchor="middle" class="small">scope 和代码一致</text>
  <text x="670" y="482" text-anchor="middle" class="tiny">specs 可测 · design 明确 · tasks 具体 · 无矛盾</text>

  <rect x="880" y="410" width="240" height="88" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1000" y="440" text-anchor="middle" class="label">ITR-09 交棒 apply</text>
  <text x="1000" y="464" text-anchor="middle" class="small">/opsx:apply 可以开始</text>
  <text x="1000" y="482" text-anchor="middle" class="tiny">真正可实施的 artifacts</text>

  <!-- Loop arrow from ITR-06 back to ITR-03 -->
  <path d="M1020,332 C1020,370 1120,133 1100,133" class="loop"/>
  <text x="1128" y="235" class="tiny" fill="#f59e0b">有 gap</text>

  <!-- Arrow from ITR-06 to ITR-07 (no gap path) -->
  <path d="M1020,332 C1020,370 270,370 270,410" class="arrow"/>
  <text x="660" y="395" text-anchor="middle" class="tiny" fill="#475569">无 gap →</text>

  <path d="M420,454 L540,454" class="arrow"/>
  <path d="M800,454 L880,454" class="arrow"/>

  <!-- Row 4: output -->
  <rect x="340" y="570" width="500" height="72" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="590" y="598" text-anchor="middle" class="label">输出：真正可实施的 artifacts + 审视记录</text>
  <text x="590" y="622" text-anchor="middle" class="small">proposal/specs/design/tasks 均经过代码校验，内容具体、一致、可实现</text>

  <path d="M1000,498 C1000,540 590,540 590,570" class="arrow"/>

  <!-- Legend -->
  <rect x="80" y="685" width="18" height="14" rx="3" fill="url(#explore)" stroke="#c4b5fd"/>
  <text x="105" y="697" class="tiny">Explore stance</text>
  <rect x="220" y="685" width="18" height="14" rx="3" fill="url(#agent)" stroke="#93c5fd"/>
  <text x="245" y="697" class="tiny">Agent 判断</text>
  <rect x="350" y="685" width="18" height="14" rx="3" fill="url(#cli)" stroke="#86efac"/>
  <text x="375" y="697" class="tiny">CLI / 代码搜索</text>
  <rect x="500" y="685" width="18" height="14" rx="3" fill="url(#fs)" stroke="#fdba74"/>
  <text x="525" y="697" class="tiny">文件系统</text>
  <rect x="630" y="685" width="18" height="14" rx="3" fill="url(#gate)" stroke="#facc15"/>
  <text x="655" y="697" class="tiny">判断 gate</text>
  <line x1="780" y1="692" x2="830" y2="692" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="838" y="697" class="tiny">有 gap 循环路径</text>
</svg>
