<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','PingFang SC',sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#1f2328">两条正交的线：答案性质完全不同</text>
  <text x="32" y="62" font-size="13" fill="#59636e">混在一起讲必然失真 —— 线 A 的机制是硬能力，线 B 的机制大半是软能力。</text>

  <!-- Column A -->
  <rect x="32" y="84" width="404" height="356" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <rect x="32" y="84" width="404" height="46" rx="10" fill="#ddf4ff"/>
  <rect x="32" y="116" width="404" height="14" fill="#ddf4ff"/>
  <text x="50" y="113" font-size="15.5" font-weight="700" fill="#0969da">线 A　上下文腐化</text>
  <text x="248" y="113" font-size="12" fill="#59636e">"灌进去的东西变脏"</text>

  <text x="50" y="156" font-size="12.5" font-weight="700" fill="#1a7f37">机制 —— 全部为硬能力</text>
  <rect x="50" y="166" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="62" y="183" font-size="12" fill="#1f2328">A1　注入导航简报，不是规格正文</text>
  <rect x="50" y="197" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="62" y="214" font-size="12" fill="#1f2328">A2　四级分级过滤读（省 84%）</text>
  <rect x="50" y="228" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="62" y="245" font-size="12" fill="#1f2328">A3　50 KB 字节硬预算</text>
  <rect x="50" y="259" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="62" y="276" font-size="12" fill="#1f2328">A4　rules 按 artifact 分流注入</text>
  <rect x="50" y="290" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="62" y="307" font-size="12" fill="#1f2328">A5　artifact DAG 门控</text>

  <text x="50" y="344" font-size="12.5" font-weight="700" fill="#cf222e">缺口</text>
  <rect x="50" y="354" width="368" height="70" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="62" y="374" font-size="12" fill="#1f2328">无新鲜度失效：status 是「文件存在性」，</text>
  <text x="62" y="391" font-size="12" fill="#1f2328">不是新旧 —— 改了 proposal.md，</text>
  <text x="62" y="408" font-size="12" fill="#1f2328">tasks.md 不会失效。</text>

  <!-- Column B -->
  <rect x="464" y="84" width="404" height="356" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
  <rect x="464" y="84" width="404" height="46" rx="10" fill="#fff8c5"/>
  <rect x="464" y="116" width="404" height="14" fill="#fff8c5"/>
  <text x="482" y="113" font-size="15.5" font-weight="700" fill="#9a6700">线 B　方向漂移</text>
  <text x="698" y="113" font-size="12" fill="#59636e">"产物之间不再自洽"</text>

  <text x="482" y="156" font-size="12.5" font-weight="700" fill="#1a7f37">机制 · 硬</text>
  <rect x="482" y="166" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="494" y="183" font-size="12" fill="#1f2328">B1　归档五道闸门（见 fig5）</text>
  <rect x="482" y="197" width="368" height="26" rx="6" fill="#dafbe1"/>
  <text x="494" y="214" font-size="12" fill="#1f2328">B2　自定义 schema 可建方向门控（见 fig6）</text>

  <text x="482" y="246" font-size="12.5" font-weight="700" fill="#9a6700">机制 · 软</text>
  <rect x="482" y="256" width="368" height="26" rx="6" fill="#fff8c5"/>
  <text x="494" y="273" font-size="12" fill="#1f2328">B3　update-change 双向一致性复核</text>
  <rect x="482" y="287" width="368" height="26" rx="6" fill="#fff8c5"/>
  <text x="494" y="304" font-size="12" fill="#1f2328">B4　verify 三维检查（需 expanded profile）</text>

  <text x="482" y="344" font-size="12.5" font-weight="700" fill="#cf222e">缺口</text>
  <rect x="482" y="354" width="368" height="70" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="494" y="374" font-size="12" fill="#1f2328">跨 change 依赖 / 重叠检测全无；</text>
  <text x="494" y="391" font-size="12" fill="#1f2328">能力重复零检测；三个静默 no-op；</text>
  <text x="494" y="408" font-size="12" fill="#1f2328">无陈旧 / 废弃 / 墓碑。</text>
</svg>
