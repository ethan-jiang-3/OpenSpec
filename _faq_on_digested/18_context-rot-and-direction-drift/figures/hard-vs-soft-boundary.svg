<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','PingFang SC',sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#1f2328">自带能力的两道防线：硬 vs 软</text>
  <text x="32" y="62" font-size="13" fill="#59636e">两者都随包下发，但性质完全不同。把软能力当硬能力讲，是这个问题上最容易犯的错。</text>

  <!-- HARD -->
  <rect x="32" y="86" width="836" height="140" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="32" y="86" width="7" height="140" rx="3.5" fill="#1a7f37"/>
  <text x="58" y="116" font-size="16.5" font-weight="700" fill="#1a7f37">硬能力 · 代码判定</text>
  <text x="58" y="140" font-size="12.5" fill="#1f2328">validate 规则集 ｜ scenario 丢失双闸 ｜ 归档合并硬拒绝 ｜ 全或无写入</text>
  <text x="58" y="159" font-size="12.5" fill="#1f2328">50KB 字节预算 ｜ rules 键对账 ｜ artifact DAG 门控</text>
  <rect x="58" y="174" width="392" height="30" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="72" y="194" font-size="12.5" font-weight="600" fill="#1a7f37">违反 → exit 1 ／ 拒绝合并 ／ 丢弃字段</text>
  <text x="470" y="194" font-size="12" fill="#59636e">你无法绕过，也不依赖模型是否听话</text>

  <!-- SOFT -->
  <rect x="32" y="244" width="836" height="140" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <rect x="32" y="244" width="7" height="140" rx="3.5" fill="#9a6700"/>
  <text x="58" y="274" font-size="16.5" font-weight="700" fill="#9a6700">软能力 · prompt 文字</text>
  <text x="58" y="298" font-size="12.5" fill="#1f2328">schema instruction ｜ update-change 双向一致性复核 ｜ apply 范围漂移守卫</text>
  <text x="58" y="317" font-size="12.5" fill="#1f2328">explore 禁写代码 ｜ verify 三维检查 ｜ update-vs-new 启发式</text>
  <rect x="58" y="332" width="392" height="30" rx="7" fill="#ffffff" stroke="#9a6700" stroke-width="1.2"/>
  <text x="72" y="352" font-size="12.5" font-weight="600" fill="#9a6700">违反 → 什么都不会发生</text>
  <text x="470" y="352" font-size="12" fill="#59636e">模型不遵守时，你没有兜底</text>
</svg>
