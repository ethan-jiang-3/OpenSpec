name: requirement-driven
version: 1
description: 需求工程工作流——proposal → specs → tasks。和 spec-driven 同框架，交付物从代码换成 PRD。核心动态是跟利益相关者反复沟通、不断打磨需求、直到成型后递交给开发团队

artifacts:
  - id: proposal
    generates: proposal.md
    description: 问题域探索 + 利益相关者分析 + 原始需求草图——建立需求工作的上下文和边界
    template: proposal.md
    instruction: |
      创建 proposal 文档，建立对这个需求工作的上下文理解——问题是什么、谁受影响、范围在哪、成功是什么样。

      你是需求分析师，处于**启动阶段**。你的任务是理解问题空间并记录利益相关者的声音。
      不要在此时跳到方案——只记录问题域的事实、假设、和从利益相关者那里收集到的原始需求。

      文档章节：
      - **Why**：1-2 句说明这个需求解决什么业务问题或机会。为什么现在做？
      - **Problem Statement**：简洁的问题描述。什么坏了或缺失了？谁感受到痛苦？
      - **Stakeholders**：识别所有利益相关者及其角色、关注点和决策权限。用表格列出。
      - **Scope**：In Scope（明确列出）和 Out of Scope（明确排除，防止范围蔓延）。
      - **Constraints**：硬边界——预算、时间线、技术栈、法规、组织限制。记录每个约束的出处。
      - **Success Criteria**：衡量需求工程本身是否成功的标准。可衡量的结果。
      - **Desired Outcomes**：每个利益相关者视角下的成功是什么样子。聚焦结果，而非功能。
      - **User Personas**：用户/角色画像。描述每类用户的背景、目标、挫败感。
      - **Raw User Stories**：非正式的用户故事，保持利益相关者的原话。"As a <role>, I want <capability> so that <benefit>"。这个阶段的产出可以是混乱的、非正式的、甚至自相矛盾的——这是正常的。
      - **Edge Cases & Scenarios**：对话中捕获的"那如果……？"——非正常情况、边界条件。
      - **Clarifying Questions Asked**：记录需求获取过程中的问答——建立需求来源的审计追踪。
      - **Assumptions**：我们假设为真的内容。区分事实（利益相关者说的）和假设（你推断的）。这些在 specs 阶段需要验证。
      - **Open Questions**：在开始规格化之前还需要理解什么？

      关键行为准则：
      - **提问优先**：上下文不足时，主动向用户提问。不要编造——标记不确定处并请求澄清。
      - **识别缺失的利益相关者**：如果只听到一个角色的声音，主动问"还有谁会受这个影响？"
      - **用"五个为什么"挖根因**：利益相关者提出功能请求时，追问为什么。"我要导出PDF"→"为什么？"→"要给老板看"→"老板看什么？"→"周报数据"→真正的需求可能是"自动生成周报"。
      - **区分需求和方案**："在右上角加一个红色按钮"→"你需要一种高亮提示紧急操作的方式"。
      - **记录矛盾但不裁决**：两个利益相关者说了矛盾的话？记录下来，标注冲突。裁决留给 specs 阶段。
      - **主动追问边界情况**："如果用户没登录呢？""如果数据为空呢？""如果网络断了呢？"
      - **不要在此时追求完整性**：获取是迭代的。specs 阶段会暴露更多需要回来补充的内容。
      - **区分事实和假设**：把你被告知的标记为事实，把你推断的标记为假设。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 正式需求规格文档（PRD）——结构化、可测试、有优先级的需求定义
    template: spec.md
    instruction: |
      创建正式的需求规格文档——将 proposal 中的原始需求转化为结构化、可测试、可排期的 PRD。

      你是需求分析师，处于**规格化阶段**。输入是 proposal.md 中的原始需求（用利益相关者的语言记录），
      输出是一个结构化的产品需求文档，开发团队可以直接使用。

      文档章节：
      - **Executive Summary**：2-3句概述这份需求覆盖的范围。
      - **Functional Requirements**：每个功能需求使用 FR-N 编号。包含：
        描述（系统 SHALL 做什么）、优先级（Must/Should/Could/Won't - MoSCoW）、
        验收标准（checkbox 格式的可验证条件）、依赖（其他需求或外部系统）、
        来源（追溯到 proposal.md 中的哪个用户故事）。
      - **Non-Functional Requirements**：性能、安全、可用性、可维护性等。每个 NFR 必须包含可衡量的指标和验证方式。
      - **User Stories (Refined)**：把 proposal.md 中的原始故事精炼为正式的用户故事表格，
        包含 ID、故事、验收标准、优先级、来源。
      - **Assumptions & Dependencies**：我们假设什么？依赖哪些外部系统/团队？如果假设错了会怎样？
      - **Risks**：已知风险和缓解策略。用表格记录风险、可能性、影响、缓解措施。
      - **Glossary**：定义领域专有术语。
      - **Open Clarifications**：在 specs 完成前需要利益相关者回答的问题。
      - **Approval**：批准状态（留空，apply 阶段推动签收时填写）——Approver、Date、Status、Conditions/Caveats。

      关键行为准则：
      - **使用 SHALL/MUST 写规范性需求**：每个需求必须是可测试的陈述。
        "用户 SHALL 能够在 3 秒内导出数据"而不是"导出应该很快"。
      - **验收标准必须可验证**：每个 checkbox 必须是二元的——可以通过或失败。
        "用户体验好"不是验收标准；"用户能在 3 次点击内完成核心任务"才是。
      - **MoSCoW 优先级必须诚实**：Must = 没有这个系统不可用。Should = 重要但可用 workaround。
        Could = 锦上添花。Won't = 明确这一版不做。不要把"想要"标成"Must"。
      - **识别缺失的信息**：如果 proposal 中的某个需求缺少足够细节来写验收标准，
        不要猜测——在 Assumptions 中标注你做了什么假设，或在 Open Clarifications 中列出需要澄清的问题。
      - **标记范围边界**：Out of Scope 和 In Scope 一样重要。利益相关者提到的想法如果这一版不做，放 Out of Scope 并标注原因。
      - **关注冲突**：如果 proposal 中有矛盾的需求，在 specs 中标注冲突并提出解决方案。
        无法解决则标记为需要利益相关者裁决。
      - **写"开发可用的"需求**：想象自己是接手这个文档的开发者。需求是否足够清晰完整，
        让他们可以开始估算和设计？如果不是，还缺什么？
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 需求工程流程的可追踪进度清单——从启用到交接的每个步骤
    template: tasks.md
    instruction: |
      创建需求工程流程的任务清单。

      **重要：严格按照下面的模板格式。** apply 阶段通过解析 checkbox 格式来追踪进度。
      不遵循 `- [ ]` 格式的任务不会被追踪。

      指南：
      - 用 ## 编号标题分组相关任务
      - 每个任务必须是 checkbox：`- [ ] X.Y 任务描述`
      - 任务应该小到可以在一个会话中完成
      - 按依赖顺序排列任务（哪些必须先完成？）
      - 每个 checkbox 必须内嵌自己的 verification：test、command、可观察结果或 artifact inspection
      - 只有跨多个实施任务的验证才单列 Integration Verification

      参考 proposal.md 了解背景和利益相关者，specs 了解需要跟踪的需求条目。

      示例分组：
      - 1. Proposal（启动阶段）
      - 2. Specification（规格化）
      - 3. Review & Validation（审查和验证）
      - 4. Approval & Handoff（批准和交接）

      verification 是每个任务的一部分，不是最后统一补一句“review”。
    requires:
      - proposal
      - specs

apply:
  requires:
    - specs
    - tasks
  tracks: tasks.md
  instruction: |
    Execute the requirement engineering workflow using the checklist:
    1) read proposal.md and specs before making changes
    2) complete tasks in priority order, mark `[x]` as you go
    3) when a task needs stakeholder input, ask — don't assume or invent
    4) if review finds gaps in specs, update specs and re-review; if gaps trace back to proposal, update proposal too
    5) add new tasks to tasks.md when discoveries trigger rework

    Review each spec against this checklist before marking Review tasks complete:
    - every Must FR has testable acceptance criteria (binary pass/fail)
    - happy path + error + empty + edge cases covered
    - no conflicting or ambiguous requirements
    - no unstated assumptions (all documented in specs)

    Definition of done:
    - all tasks checked
    - Approval section in specs filled (Approver, Date, Status)
    - Developer Handoff Notes in specs completed
    - stakeholder confirms "this is what I want"
